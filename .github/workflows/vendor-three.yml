name: Vendor Three.js
on:
  push:
    paths-ignore:
      - three.min.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Three.js
        run: curl -L --fail --retry 3 https://unpkg.com/three@0.181.1/build/three.min.js -o three.min.js
      - name: Commit Three.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add three.min.js
          git diff --cached --quiet || git commit -m "Adiciona Three.js local"
          git push