<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91c8e2;touch-action:none;font-family:Arial}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#look{position:fixed;right:0;top:0;width:72%;height:100%;z-index:4;touch-action:none}
#joy{position:fixed;left:18px;bottom:18px;width:138px;height:138px;border:2px solid #fffc;border-radius:50%;background:#0003;z-index:10;touch-action:none}
#knob{position:absolute;left:43px;top:43px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 3px 12px #0008}
</style></head><body>
<canvas id="game"></canvas><div id="look"></div><div id="joy"><div id="knob"></div></div>
<script>
const C=document.getElementById('game'),X=C.getContext('2d');
let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();

const P={x:0,z:-7,y:1.7,angle:0,look:0},F=Math.min(W,H)*.92;
let jx=0,jy=0,drag=false,lx=0,ly=0,last=performance.now();

const HOUSES=[
[-8.4,7,5,6,3.1,'#d6ad87','#875440'],[-8.4,19,5.2,6.4,3.2,'#cc877a','#70463d'],
[-8.4,32,5,6,3.3,'#d8d2c8','#70564b'],[-8.4,45,5.2,6.2,3.1,'#c8b09b','#725247'],
[8.4,8,5,6,3.1,'#d7cbb1','#765043'],[8.4,21,5.2,6.4,3.2,'#cda17e','#6d493d'],
[8.4,34,5,6,3.3,'#ddd7ce','#785247'],[8.4,47,5.2,6.2,3.1,'#d1b18e','#705045']
];
const TREES=[[-4.3,5,1],[-4.3,16,.9],[-4.3,28,1],[-4.3,41,.9],[-4.3,54,1],[4.3,12,.9],[4.3,26,1],[4.3,40,.9],[4.3,54,1]];
const POLES=[[-3.35,3],[-3.35,18],[-3.35,34],[-3.35,50],[3.35,10],[3.35,26],[3.35,43]];

function proj(x,y,z){
 let dx=x-P.x,dz=z-P.z;
 let co=Math.cos(P.angle),si=Math.sin(P.angle);
 let sx=dx*co-dz*si, sz=dx*si+dz*co;
 let cp=Math.cos(P.look),sp=Math.sin(P.look);
 let sy=(y-P.y)*cp-sz*sp, zz=(y-P.y)*sp+sz*cp;
 if(zz<.12)return null;
 return {x:W/2+sx*F/zz,y:H*.52-sy*F/zz,s:F/zz,z:zz};
}
function face(a,col){
 if(a.some(q=>!q))return;
 X.fillStyle=col;X.beginPath();X.moveTo(a[0].x,a[0].y);for(let i=1;i<a.length;i++)X.lineTo(a[i].x,a[i].y);X.closePath();X.fill();
}
function col(c,n){let v=parseInt(c.slice(1),16),r=Math.max(0,Math.min(255,(v>>16)+n)),g=Math.max(0,Math.min(255,((v>>8)&255)+n)),b=Math.max(0,Math.min(255,(v&255)+n));return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}

function house(h){
 let [cx,cz,w,d,hgt,base,roof]=h;
 const y0=0,y1=hgt;
 const V=[
  proj(cx-w/2,y0,cz-d/2),proj(cx+w/2,y0,cz-d/2),proj(cx+w/2,y1,cz-d/2),proj(cx-w/2,y1,cz-d/2),
  proj(cx-w/2,y0,cz+d/2),proj(cx+w/2,y0,cz+d/2),proj(cx+w/2,y1,cz+d/2),proj(cx-w/2,y1,cz+d/2)
 ];
 if(V.some(q=>!q))return;
 // Caixa totalmente fechada: frente, trás e duas laterais.
 face([V[0],V[1],V[2],V[3]],base);
 face([V[1],V[5],V[6],V[2]],col(base,-12));
 face([V[5],V[4],V[7],V[6]],col(base,-25));
 face([V[4],V[0],V[3],V[7]],col(base,-18));
 // Fundo/parede traseira opaca.
 face([V[3],V[2],V[6],V[7]],col(base,-8));
 // Telhado completo, dos dois lados.
 const peakFront=proj(cx,y1+1.05,cz-d/2);
 const peakBack=proj(cx,y1+1.05,cz+d/2);
 if(peakFront&&peakBack){
  face([V[3],V[2],peakFront],roof);
  face([V[7],peakBack,peakFront,V[3]],col(roof,-12));
  face([V[6],V[2],peakFront,peakBack],col(roof,-20));
  face([V[4],V[5],peakBack],col(roof,-8));
 }
 // Porta e janelas só na fachada da frente.
 const door=proj(cx,y1*.47,cz-d/2-.035);
 if(door){X.fillStyle='#49342d';X.fillRect(door.x-door.s*.04,door.y-door.s*.13,door.s*.08,door.s*.26)}
 for(const wx of [cx-w*.28,cx+w*.28]){
  const q=proj(wx,y1*.63,cz-d/2-.04);
  if(q){
   X.fillStyle='#9ec6d1';X.fillRect(q.x-q.s*.055,q.y-q.s*.05,q.s*.11,q.s*.10);
   X.strokeStyle='#454545';X.lineWidth=Math.max(1,q.s*.008);X.strokeRect(q.x-q.s*.055,q.y-q.s*.05,q.s*.11,q.s*.10);
   X.beginPath();X.moveTo(q.x,q.y-q.s*.05);X.lineTo(q.x,q.y+q.s*.05);X.moveTo(q.x-q.s*.055,q.y);X.lineTo(q.x+q.s*.055,q.y);X.stroke();
  }
 }
}
function tree(t){
 let [cx,cz,s]=t;
 const b=proj(cx,0,cz), top=proj(cx,3.4*s,cz);
 if(!b||!top)return;
 X.strokeStyle='#59402b';X.lineWidth=Math.max(2,b.s*.045);X.beginPath();X.moveTo(b.x,b.y);X.lineTo(top.x,top.y);X.stroke();
 const parts=[
  [cx,2.75*s,cz,0.42],[cx-.38*s,2.45*s,cz,0.34],[cx+.38*s,2.45*s,cz,0.34],
  [cx,2.2*s,cz-.22*s,0.34],[cx,2.2*s,cz+.22*s,0.34]
 ];
 for(const [x,y,z,r] of parts){
  const q=proj(x,y,z);if(!q)continue;
  const rr=Math.max(8,q.s*r);
  X.fillStyle='#2f6339';X.beginPath();X.arc(q.x,q.y,rr,0,Math.PI*2);X.fill();
  X.fillStyle='#4b8148';X.beginPath();X.arc(q.x-rr*.22,q.y-rr*.22,rr*.58,0,Math.PI*2);X.fill();
 }
}
function pole(t){let a=proj(t[0],0,t[1]),b=proj(t[0],5.2,t[1]);if(!a||!b)return;X.strokeStyle='#555';X.lineWidth=Math.max(2,a.s*.025);X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke()}

function strip(x1,x2,z1,z2,y,material){
 const a=proj(x1,y,z1),b=proj(x2,y,z1),c=proj(x2,y,z2),d=proj(x1,y,z2);
 if(!a||!b||!c||!d)return;
 face([a,b,c,d],material);
}
function road(){
 // Céu é sempre céu. O verde não ocupa a tela inteira quando a câmera sobe.
 X.fillStyle='#91c8e2';X.fillRect(0,0,W,H);
 // Solo mundial, fixo. Usamos faixas em profundidade para manter perspectiva estável.
 const near=P.z+.35, far=P.z+150;
 strip(-18,18,near,far,0,'#6f955c');
 strip(-5.15,-3.55,near,far,.012,'#b8b2a7');
 strip(3.55,5.15,near,far,.012,'#b8b2a7');
 strip(-3.55,3.55,near,far,.018,'#4f5050');
 for(let z=near+3;z<far;z+=9) strip(-.075,.075,z,z+3,.035,'#e1d47d');
}

function render(){
 road();
 const items=[];
 HOUSES.forEach(h=>items.push([Math.hypot(h[0]-P.x,h[1]-P.z),()=>house(h)]));
 TREES.forEach(t=>items.push([Math.hypot(t[0]-P.x,t[1]-P.z),()=>tree(t)]));
 POLES.forEach(t=>items.push([Math.hypot(t[0]-P.x,t[1]-P.z),()=>pole(t)]));
 items.sort((a,b)=>b[0]-a[0]);for(const i of items)i[1]();
 requestAnimationFrame(render);
}
render();

function joy(e){
 let r=document.getElementById('joy').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=43,n=Math.hypot(x,y);
 if(n>m){x=x/n*m;y=y/n*m}jx=x/m;jy=y/m;document.getElementById('knob').style.transform='translate('+x+'px,'+y+'px)';
}
joyEl=document.getElementById('joy');
joyEl.onpointerdown=e=>{e.preventDefault();joyEl.setPointerCapture(e.pointerId);joy(e)};
joyEl.onpointermove=e=>{if(joyEl.hasPointerCapture(e.pointerId))joy(e)};
function stopJoy(){jx=jy=0;document.getElementById('knob').style.transform='translate(0,0)'}
joyEl.onpointerup=stopJoy;joyEl.onpointercancel=stopJoy;

look.onpointerdown=e=>{e.preventDefault();drag=true;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)};
look.onpointermove=e=>{if(!drag)return;P.angle-=(e.clientX-lx)*.005;P.look=Math.max(-.28,Math.min(.28,P.look-(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY};
look.onpointerup=look.onpointercancel=()=>drag=false;

function update(t){
 let dt=Math.min(.04,(t-last)/1000);last=t;
 let speed=4.2,forward=-jy*speed*dt,side=jx*speed*dt;
 // movimento no mundo, usando apenas a direção da câmera. O cenário nunca gira.
 P.x+=Math.sin(P.angle)*forward+Math.cos(P.angle)*side;
 P.z+=Math.cos(P.angle)*forward-Math.sin(P.angle)*side;
 P.x=Math.max(-3,Math.min(3,P.x));P.z=Math.max(-12,Math.min(100,P.z));
 requestAnimationFrame(update);
}
requestAnimationFrame(update);
</script></body></html>
