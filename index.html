<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D • Loja Explosão</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fd0f4;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#menu{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:linear-gradient(#76bce8,#c9e7f4 55%,#8a7564)}
.panel{width:min(92vw,520px);padding:28px;border-radius:24px;background:#111a20ee;color:#fff;text-align:center;box-shadow:0 20px 60px #0008}
h1{margin:0 0 6px;font-size:34px;letter-spacing:2px}.sub{opacity:.75;font-size:12px;margin-bottom:22px}
input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff33;background:#18242b;color:#fff;font:inherit}
button{margin-top:10px;font-weight:700;background:#2c7d57}.note{font-size:11px;line-height:1.5;opacity:.65;margin-top:14px}
#hud{display:none;position:fixed;inset:0;z-index:5;pointer-events:none}
#tip{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#111a20cc;color:#fff;padding:8px 12px;border-radius:10px;font-size:11px;white-space:nowrap}
#map{position:absolute;right:12px;top:12px;width:118px;height:118px;background:#f4f1e8dd;border:2px solid #fff;border-radius:12px;box-shadow:0 4px 16px #0004}
#coords{position:absolute;left:12px;top:12px;background:#111a20cc;color:#fff;padding:8px;border-radius:10px;font-size:11px}
#mobile{display:none;position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;left:18px;bottom:22px;width:132px;height:132px;border:1px solid #fff5;border-radius:50%;background:#0002;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#fff8;border:1px solid #fff;pointer-events:none}
#look{position:absolute;right:0;top:16%;bottom:16%;width:55%;pointer-events:auto}
#looklabel{position:absolute;right:12px;bottom:12px;color:#fff8;font-size:10px}
@media(max-width:700px){#mobile{display:block}#tip{top:8px;font-size:10px}#map{width:92px;height:92px}.panel{padding:22px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu"><div class="panel">
<h1>RUA 3D</h1><div class="sub">EXPLORAÇÃO EM PRIMEIRA PESSOA</div>
<input id="name" maxlength="16" placeholder="Seu nome">
<button id="play">ENTRAR NA RUA</button>
<div class="note">Cenário inicial baseado nas referências enviadas. Sem carros, NPCs ou efeitos adicionais. O foco é andar e olhar ao redor.</div>
</div></div>
<div id="hud"><div id="coords"></div><div id="tip">Arraste o lado direito para olhar • use o controle para andar</div><canvas id="map" width="118" height="118"></canvas></div>
<div id="mobile"><div id="stick"><div id="knob"></div></div><div id="look"><div id="looklabel">ARRASTE PARA OLHAR</div></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),mapC=document.getElementById('map'),mctx=mapC.getContext('2d');
let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
const FOV=Math.PI/3,MAX=32,P={x:8.5,y:8.5,ang:0};
let playing=false,name='Explorador',keys={},joy={x:0,y:0,on:false},looking=false,lastX=0;
const grid=Array.from({length:17},()=>Array(17).fill(0));
function set(x,z,v){if(x>=0&&x<17&&z>=0&&z<17)grid[z][x]=v}
for(let z=0;z<17;z++){set(7,z,1);set(9,z,1)}
for(let x=0;x<17;x++){set(x,7,0);set(x,9,0)}
for(let z=0;z<17;z++)set(8,z,0);
[[1,1],[2,1],[3,1],[4,1],[5,1],[10,1],[11,1],[12,1],[13,1],[14,1],[1,2],[2,2],[3,2],[4,2],[5,2],[10,2],[11,2],[12,2],[13,2],[14,2],[1,3],[2,3],[3,3],[4,3],[5,3],[10,3],[11,3],[12,3],[13,3],[14,3],[1,11],[2,11],[3,11],[4,11],[5,11],[10,11],[11,11],[12,11],[13,11],[14,11],[1,12],[2,12],[3,12],[4,12],[5,12],[10,12],[11,12],[12,12],[13,12],[14,12],[1,13],[2,13],[3,13],[4,13],[5,13],[10,13],[11,13],[12,13],[13,13],[14,13],[1,14],[2,14],[3,14],[4,14],[5,14],[10,14],[11,14],[12,14],[13,14],[14,14]].forEach(a=>set(a[0],a[1],1));
[[6,4],[10,4],[3,4],[13,4],[2,15],[12,15],[15,5],[1,5]].forEach(a=>set(a[0],a[1],2));
[[6,2],[10,2],[6,14],[10,14]].forEach(a=>set(a[0],a[1],3));
for(let z=6;z<=10;z++)for(let x=6;x<=10;x++)if((x===6||x===10)&&z!==8)grid[z][x]=0;
function wallColor(z,x){const v=(x*17+z*31)%5;if(v===0)return'#d58b72';if(v===1)return'#f1e8d8';if(v===2)return'#a99b8e';if(v===3)return'#6ea9d6';return'#c7c1b6'}
function cast(angle){let sin=Math.sin(angle),cos=Math.cos(angle),mapX=Math.floor(P.x),mapZ=Math.floor(P.y),stepX=cos<0?-1:1,stepZ=sin<0?-1:1;let dx=Math.abs(1/(cos||1e-9)),dz=Math.abs(1/(sin||1e-9)),sideX=cos<0?(P.x-mapX)*dx:(mapX+1-P.x)*dx,sideZ=sin<0?(P.y-mapZ)*dz:(mapZ+1-P.y)*dz;for(let i=0;i<MAX*2;i++){if(sideX<sideZ){sideX+=dx;mapX+=stepX;if(mapZ>=0&&mapZ<17&&mapX>=0&&mapX<17&&grid[mapZ][mapX])return{d:sideX-dx,x:mapX,z:mapZ,t:grid[mapZ][mapX]}}else{sideZ+=dz;mapZ+=stepZ;if(mapZ>=0&&mapZ<17&&mapX>=0&&mapX<17&&grid[mapZ][mapX])return{d:sideZ-dz,x:mapX,z:mapZ,t:grid[mapZ][mapX]}}}return{d:MAX,x:0,z:0,t:0}}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#70b9ec');g.addColorStop(.56,'#c9e8f5');g.addColorStop(.57,'#b99a72');g.addColorStop(1,'#8f765d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff4c4';ctx.beginPath();ctx.arc(W*.82,H*.16,26,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff88';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(80+i*210,90+(i%2)*35,18,0,Math.PI*2);ctx.arc(105+i*210,80+(i%2)*35,25,0,Math.PI*2);ctx.arc(135+i*210,92+(i%2)*35,17,0,Math.PI*2);ctx.fill()}}
function drawWorld(){drawSky();const rays=Math.max(240,Math.min(720,Math.floor(W*.72))),step=W/rays;for(let i=0;i<rays;i++){const sx=i*step,a=P.ang-FOV/2+(i/(rays-1))*FOV,r=cast(a),corrected=r.d*Math.cos(a-P.ang),wallH=Math.min(H*1.7,H*.92/(corrected||.01)),top=H*.5-wallH*.52,bottom=H*.5+wallH*.48;ctx.fillStyle=r.t===1?wallColor(r.z,r.x):r.t===2?'#5b6f35':'#777';ctx.fillRect(sx,top,step+1,bottom-top);if(r.t===1){const stripe=Math.max(1,wallH*.055);ctx.fillStyle='#eee7dc';ctx.fillRect(sx,top+wallH*.63,step+1,stripe);ctx.fillStyle='#777';ctx.fillRect(sx,top+wallH*.74,step+1,Math.max(1,wallH*.025));const door=(r.x+r.z)%4;if(door===0){ctx.fillStyle='#55504b';ctx.fillRect(sx,top+wallH*.18,step+1,wallH*.45)}else if(door===1){ctx.fillStyle='#2f6fbe';ctx.fillRect(sx,top+wallH*.2,step+1,wallH*.42)}else if(door===2){ctx.fillStyle='#9a3f3f';ctx.fillRect(sx,top+wallH*.22,step+1,wallH*.4)}if((r.x*7+r.z)%5===0){ctx.fillStyle='#5b3925';ctx.fillRect(sx,top+wallH*.08,step+1,wallH*.1)}}else if(r.t===2){ctx.fillStyle='#6b4a2d';ctx.fillRect(sx,top+wallH*.25,step+1,wallH*.65);ctx.fillStyle='#2f6d35';ctx.beginPath();ctx.ellipse(sx+step/2,top+wallH*.18,wallH*.22,wallH*.2,0,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#5a5a5a';ctx.fillRect(sx,top,step+1,wallH);ctx.fillStyle='#222';ctx.fillRect(sx,top+wallH*.15,step+1,Math.max(1,wallH*.02))}}ctx.fillStyle='#6e6a64';ctx.fillRect(0,H*.58,W,H*.42);ctx.fillStyle='#bcb6aa';ctx.fillRect(0,H*.58,W,3);ctx.fillStyle='#fff';ctx.globalAlpha=.7;for(let x=0;x<W;x+=70)ctx.fillRect(x,H*.79,36,3);ctx.globalAlpha=1}
function move(dt){let f=0,s=0;if(keys.w||keys.arrowup)f+=1;if(keys.s||keys.arrowdown)f-=1;if(keys.a||keys.arrowleft)s-=1;if(keys.d||keys.arrowright)s+=1;if(joy.on){s+=joy.x;f-=joy.y}const len=Math.hypot(f,s);if(len){f/=len;s/=len}const speed=2.8*dt,nx=P.x+Math.cos(P.ang)*f*speed+Math.cos(P.ang+Math.PI/2)*s*speed,ny=P.y+Math.sin(P.ang)*f*speed+Math.sin(P.ang+Math.PI/2)*s*speed;const can=(x,y)=>x>.25&&y>.25&&x<16.75&&y<16.75&&grid[Math.floor(y)]?.[Math.floor(x)]===0;if(can(nx,P.y))P.x=nx;if(can(P.x,ny))P.y=ny;document.getElementById('coords').textContent=name+' • Rua 3D • '+P.x.toFixed(1)+', '+P.y.toFixed(1)}
function drawMap(){mctx.clearRect(0,0,118,118);mctx.fillStyle='#f4f1e8';mctx.fillRect(0,0,118,118);const q=118/17;for(let z=0;z<17;z++)for(let x=0;x<17;x++){const t=grid[z][x];mctx.fillStyle=t===0?'#777':'#c8c1b8';mctx.fillRect(x*q,z*q,q+1,q+1)}mctx.strokeStyle='#fff';mctx.lineWidth=1;mctx.strokeRect(7*q,0,3*q,118);mctx.strokeRect(0,7*q,118,3*q);mctx.fillStyle='#1d74d9';mctx.beginPath();mctx.arc(P.x*q,P.y*q,5,0,Math.PI*2);mctx.fill();mctx.strokeStyle='#1d74d9';mctx.beginPath();mctx.moveTo(P.x*q,P.y*q);mctx.lineTo((P.x+Math.cos(P.ang)*1.1)*q,(P.y+Math.sin(P.ang)*1.1)*q);mctx.stroke()}
function frame(){if(playing){move(.016);drawWorld();drawMap()}else{drawSky();ctx.fillStyle='#6e6a64';ctx.fillRect(0,H*.58,W,H*.42)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.getElementById('play').onclick=()=>{name=document.getElementById('name').value.trim()||'Explorador';playing=true;document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='block'};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
function joySet(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy,m=52,l=Math.hypot(x,y);if(l>m){x=x/l*m;y=y/l*m}joy.x=x/m;joy.y=y/m;joy.on=true;knob.style.transform='translate('+x+'px,'+y+'px)'}
function joyEnd(){joy.x=0;joy.y=0;joy.on=false;knob.style.transform='translate(0,0)'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stick.setPointerCapture(e.pointerId);joySet(e)},{passive:false});stick.addEventListener('pointermove',e=>{if(joy.on){e.preventDefault();joySet(e)}},{passive:false});stick.addEventListener('pointerup',joyEnd);stick.addEventListener('pointercancel',joyEnd);
const look=document.getElementById('look');look.addEventListener('pointerdown',e=>{if(!playing)return;e.preventDefault();looking=true;lastX=e.clientX;look.setPointerCapture(e.pointerId)},{passive:false});look.addEventListener('pointermove',e=>{if(!looking)return;e.preventDefault();P.ang+=(e.clientX-lastX)*.012;lastX=e.clientX},{passive:false});look.addEventListener('pointerup',()=>looking=false);look.addEventListener('pointercancel',()=>looking=false);
document.addEventListener('touchmove',e=>{if(playing)e.preventDefault()},{passive:false});
})();
</script>
</body>
</html>
