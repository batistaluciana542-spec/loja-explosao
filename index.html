<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87c9ee;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;top:14px;left:14px;padding:8px 11px;border-radius:10px;background:rgba(0,0,0,.35);color:#fff;font-weight:700;font-size:13px}
#look{position:absolute;right:0;top:0;width:65%;height:100%;pointer-events:auto}
#joystick{position:absolute;left:18px;bottom:22px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);pointer-events:auto}
#stick{position:absolute;left:35px;top:35px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.82)}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:6px 9px;border-radius:9px;background:rgba(0,0,0,.32);color:#fff;font-size:11px;white-space:nowrap}
#status{position:absolute;right:14px;top:14px;padding:7px 9px;border-radius:9px;background:rgba(0,0,0,.32);color:#fff;font-size:11px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="title">RUA 3D</div>
  <div id="status">3D ATIVO</div>
  <div id="look"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="hint">Arraste à direita para olhar • joystick para andar</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.min.js"></script>
<script>
(function(){
'use strict';

if(!window.THREE){
  document.getElementById('status').textContent='ERRO NO MOTOR 3D';
  return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87c9ee);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,250);
camera.position.set(0,1.65,18);

let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true});
}catch(e){
  document.getElementById('status').textContent='WEBGL INDISPONÍVEL';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('game').appendChild(renderer.domElement);

const mat={
 road:new THREE.MeshBasicMaterial({color:0x555555}),
 sidewalk:new THREE.MeshBasicMaterial({color:0xbdb8ad}),
 curb:new THREE.MeshBasicMaterial({color:0xd9d4c9}),
 grass:new THREE.MeshBasicMaterial({color:0x668452}),
 white:new THREE.MeshBasicMaterial({color:0xe8e2d7}),
 cream:new THREE.MeshBasicMaterial({color:0xd8c19f}),
 peach:new THREE.MeshBasicMaterial({color:0xc98270}),
 gray:new THREE.MeshBasicMaterial({color:0x77736f}),
 blue:new THREE.MeshBasicMaterial({color:0x5f91ae}),
 red:new THREE.MeshBasicMaterial({color:0xa95449}),
 roof:new THREE.MeshBasicMaterial({color:0x665044}),
 gate:new THREE.MeshBasicMaterial({color:0x33383b}),
 glass:new THREE.MeshBasicMaterial({color:0x355d6b}),
 wood:new THREE.MeshBasicMaterial({color:0x76503a}),
 green:new THREE.MeshBasicMaterial({color:0x4d753e}),
 trunk:new THREE.MeshBasicMaterial({color:0x684a35}),
 pole:new THREE.MeshBasicMaterial({color:0x777777}),
 wire:new THREE.MeshBasicMaterial({color:0x202020})
};

function box(w,h,d,x,y,z,material){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  o.position.set(x,y,z);
  scene.add(o);
  return o;
}

function cylinder(r,h,x,y,z,material){
  const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,10),material);
  o.position.set(x,y,z);
  scene.add(o);
  return o;
}

// CHÃO
box(14,.12,190,0,-.08,0,mat.road);
box(7,.12,190,-10.5,-.02,0,mat.sidewalk);
box(7,.12,190,10.5,-.02,0,mat.sidewalk);
box(.28,.25,190,-6.95,.06,0,mat.curb);
box(.28,.25,190,6.95,.06,0,mat.curb);

// CRUZAMENTO
box(35,.13,13,0,-.01,-24,mat.road);
box(35,.12,2,0,.05,-17.5,mat.sidewalk);
box(35,.12,2,0,.05,-30.5,mat.sidewalk);

// CASAS SIMPLES E SEPARADAS
const houseColors=[mat.cream,mat.white,mat.peach,mat.gray,mat.blue,mat.red];

function house(x,z,i){
  const w=6.6+(i%3)*.5;
  const depth=5;
  const h=3.1+(i%2)*.35;
  const wall=houseColors[i%houseColors.length];

  box(w,h,depth,x,h/2,z,wall);
  box(w+.18,.25,depth+.18,x,h+.12,z,mat.white);

  // fachada voltada para a rua
  const front=z+(x<0?depth/2:-depth/2);

  // portão
  const gateW=2.5;
  box(gateW,1.95,.14,x,1.0,front+(x<0?.08:-.08),mat.gate);

  // porta
  box(.9,1.9,.16,x+(i%2?1.7:-1.7),.95,front+(x<0?.1:-.1),mat.wood);

  // janelas
  const wx=x+(i%2?-1.7:1.7);
  box(1.25,1.0,.12,wx,1.75,front+(x<0?.08:-.08),mat.glass);

  // detalhe vertical
  box(.08,1.15,.15,wx-.7,1.72,front+(x<0?.11:-.11),mat.white);
  box(.08,1.15,.15,wx+.7,1.72,front+(x<0?.11:-.11),mat.white);

  // pequena calçada de entrada
  box(w-.3,.07,1.0,x,.12,front+(x<0?.55:-.55),mat.curb);
}

const zs=[-9,2,13,24,35,46,57];
zs.forEach((z,i)=>house(-10,z,i));
zs.forEach((z,i)=>house(10,z,i+3));

// ÁRVORES
function tree(x,z,s){
  cylinder(.16*s,2.3*s,x,1.15*s,z,mat.trunk);
  const crown=new THREE.Mesh(new THREE.SphereGeometry(1.25*s,10,8),mat.green);
  crown.position.set(x,2.75*s,z);
  scene.add(crown);
}
tree(-6.2,-2,.9);
tree(6.2,7,.8);
tree(-6.2,29,1);
tree(6.2,43,.85);

// POSTES
function pole(x,z){
  box(.16,7,.16,x,3.5,z,mat.pole);
  box(2,.12,.12,x+(x<0?1:-1),6.55,z,mat.pole);
}
pole(-5.8,-12);
pole(5.8,8);
pole(-5.8,31);
pole(5.8,54);

// FIOS
function wire(x){
  const pts=[
    new THREE.Vector3(x,6.55,-70),
    new THREE.Vector3(x,6.15,0),
    new THREE.Vector3(x,6.4,70)
  ];
  const curve=new THREE.CatmullRomCurve3(pts);
  const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,30,.018,5,false),mat.wire);
  scene.add(tube);
}
wire(-5.8);
wire(5.8);

// CONTROLES
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true});
addEventListener('keyup',e=>{keys[e.code]=false});

const joystick=document.getElementById('joystick');
const stick=document.getElementById('stick');
let joyId=null,joyX=0,joyY=0;

function updateJoy(e){
  const r=joystick.getBoundingClientRect();
  let dx=e.clientX-(r.left+r.width/2);
  let dy=e.clientY-(r.top+r.height/2);
  const max=34;
  const len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  joyX=dx/max;
  joyY=dy/max;
  stick.style.transform='translate('+dx+'px,'+dy+'px)';
}
joystick.addEventListener('pointerdown',e=>{
  joyId=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  updateJoy(e);
});
joystick.addEventListener('pointermove',e=>{
  if(e.pointerId===joyId)updateJoy(e);
});
function endJoy(e){
  if(e.pointerId!==joyId)return;
  joyId=null;joyX=0;joyY=0;
  stick.style.transform='translate(0,0)';
}
joystick.addEventListener('pointerup',endJoy);
joystick.addEventListener('pointercancel',endJoy);

// OLHAR
const look=document.getElementById('look');
let lookId=null,lastX=0,lastY=0;
let yaw=0;
let pitch=0;

look.addEventListener('pointerdown',e=>{
  lookId=e.pointerId;
  look.setPointerCapture(e.pointerId);
  lastX=e.clientX;
  lastY=e.clientY;
});

look.addEventListener('pointermove',e=>{
  if(e.pointerId!==lookId)return;
  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;
  yaw-=dx*.004;
  pitch+=dy*.003;
  pitch=Math.max(-1.15,Math.min(1.15,pitch));
  lastX=e.clientX;
  lastY=e.clientY;
});

look.addEventListener('pointerup',e=>{
  if(e.pointerId===lookId)lookId=null;
});
look.addEventListener('pointercancel',e=>{
  if(e.pointerId===lookId)lookId=null;
});

// MOVIMENTO
const clock=new THREE.Clock();

function move(dt){
  let forward=0;
  let side=0;

  if(keys.KeyW||keys.ArrowUp)forward+=1;
  if(keys.KeyS||keys.ArrowDown)forward-=1;
  if(keys.KeyA||keys.ArrowLeft)side-=1;
  if(keys.KeyD||keys.ArrowRight)side+=1;

  forward+=-joyY;
  side+=joyX;

  const len=Math.hypot(forward,side);
  if(len>1){forward/=len;side/=len}

  const speed=4.2*dt;

  // Direção correta: yaw 0 = olhando para frente, eixo -Z.
  const fx=Math.sin(yaw);
  const fz=-Math.cos(yaw);
  const rx=Math.cos(yaw);
  const rz=Math.sin(yaw);

  camera.position.x+=(fx*forward+rx*side)*speed;
  camera.position.z+=(fz*forward+rz*side)*speed;

  // Limites seguros da rua
  camera.position.x=Math.max(-5.7,Math.min(5.7,camera.position.x));
  camera.position.z=Math.max(-70,Math.min(70,camera.position.z));
  camera.position.y=1.65;

  // Câmera sempre olha para frente, sem ficar de cabeça para baixo.
  const cp=Math.cos(pitch);
  const target=new THREE.Vector3(
    camera.position.x+fx*cp,
    camera.position.y+Math.sin(pitch),
    camera.position.z+fz*cp
  );
  camera.lookAt(target);
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  move(dt);
  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
})();
</script>
</body>
</html>
