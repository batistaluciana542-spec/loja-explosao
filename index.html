<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>NEON FRONTIER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050713;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%}
#menu{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:radial-gradient(circle,#19275b,#050713 65%)}.panel{width:min(92%,560px);padding:30px;text-align:center;border:1px solid #42eaff88;border-radius:24px;background:#080e20ee;box-shadow:0 0 60px #00d9ff22}.logo{font-size:52px;font-weight:900;letter-spacing:5px;color:#6df8ff;text-shadow:0 0 20px #00d9ff}.sub{color:#9eafd0;letter-spacing:3px;margin:5px 0 25px}input,button{border:1px solid #40eaff66;border-radius:12px;background:#0b1630;color:#fff;padding:13px;font-size:16px}input{width:100%;outline:none}button{cursor:pointer;font-weight:bold}button:hover{border-color:#5ff6ff;background:#14244b}.main{width:100%;margin-top:10px;background:linear-gradient(135deg,#075d78,#53277c)}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}.hint{font-size:13px;color:#8092b5;line-height:1.5;margin-top:18px}
#hud{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}.box{position:absolute;pointer-events:auto;background:#07101ddd;border:1px solid #37eaff55;border-radius:14px;padding:11px;backdrop-filter:blur(7px)}#stats{left:12px;top:12px;min-width:215px}#mission{right:12px;top:12px;width:250px}#chat{left:12px;bottom:12px;width:min(370px,calc(100% - 24px));height:175px}.msgs{height:120px;overflow:auto;font-size:13px;color:#c9d6ed}.chatin{width:calc(100% - 50px);padding:8px;font-size:13px}.send{padding:8px;width:42px}.bar{height:9px;background:#1b263d;border-radius:9px;overflow:hidden}.hp{height:100%;background:#ff4778}.xp{height:100%;background:#4ceeff}#actions{right:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:330px}#actions button{font-size:13px;padding:9px}#mini{right:12px;top:150px;width:150px;height:150px}.mobile{display:none;position:fixed;z-index:7;left:12px;bottom:205px}.mobile button{position:absolute;width:48px;height:48px;padding:0}.up{left:52px}.down{left:52px;top:104px}.left{top:52px}.right{top:52px;left:104px}.pad{position:relative;width:155px;height:155px}
@media(max-width:700px){.mobile{display:block}#actions{display:none}#mini{width:110px;height:110px;top:12px}.logo{font-size:38px}#mission{width:180px;top:130px}}
</style></head><body>
<canvas id="game"></canvas>
<div id="menu"><div class="panel"><div class="logo">NEON<br>FRONTIER</div><div class="sub">MUNDO ABERTO • MULTIPLAYER</div>
<input id="name" maxlength="16" placeholder="Nome do explorador"><button class="main" id="play">ENTRAR NO MUNDO</button><div class="row"><button id="create">CRIAR SALA</button><button id="join">ENTRAR EM SALA</button></div>
<div class="hint">WASD / setas: mover • Espaço: atacar • E: coletar/interagir<br>Multiplayer por WebRTC. Um jogador cria a sala e compartilha o código.</div></div></div>
<div id="hud"><div id="stats" class="box"><b id="pname">EXPLORADOR</b><div>Nível <span id="level">1</span> • XP <span id="xptext">0</span>/100</div><div class="bar"><div id="hp" class="hp" style="width:100%"></div></div><small>HP <span id="hptext">100</span>/100 • 💰 <span id="money">25</span></small></div>
<div id="mission" class="box"><b>MISSÃO</b><div id="quest">Encontre um cristal azul.</div><small id="qprog">0 / 1</small></div>
<canvas id="mini" class="box"></canvas>
<div id="chat" class="box"><div id="msgs" class="msgs"></div><input id="chatin" class="chatin" maxlength="70" placeholder="Mensagem..."><button id="send" class="send">➤</button></div>
<div id="actions" class="box"><button id="atk">⚔ ATACAR</button><button id="int">E COLETAR</button><button id="bag">🎒 INVENTÁRIO</button><button id="save">💾 SALVAR</button></div></div>
<div class="mobile"><div class="pad"><button class="up" data-k="w">▲</button><button class="down" data-k="s">▼</button><button class="left" data-k="a">◀</button><button class="right" data-k="d">▶</button></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),mini=document.getElementById('mini'),mx=mini.getContext('2d');let W,H;
function size(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);mini.width=mini.clientWidth*devicePixelRatio;mini.height=mini.clientHeight*devicePixelRatio;mx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}size();onresize=size;
const S=180,T=48,keys={},remote={},enemies=[],items=[],parts=[];let me={id:'me',name:'Explorador',x:S*T/2,y:S*T/2,hp:100,max:100,lvl:1,xp:0,money:25,inv:{crystal:0,wood:0,ore:0,potion:2},color:'#62f5ff'},cam={x:0,y:0},peer,conns=[],playing=false,seed=Math.random()*100000,attackTimer=0,host=false,quest=false;
function rnd(a,b){return a+Math.random()*(b-a)}function tile(px,py){let n=Math.abs(Math.sin((Math.floor(px/T)*127.1+Math.floor(py/T)*311.7+seed)*.017))*100%1;return n<.09?'water':n<.22?'sand':n<.55?'grass':n<.88?'forest':'rock'}
for(let i=0;i<130;i++){let a=rnd(2,S-2)*T,b=rnd(2,S-2)*T;if(tile(a,b)!=='water')items.push({x:a,y:b,t:['wood','ore','crystal'][i%3],got:false})}
for(let i=0;i<32;i++){let a=rnd(4,S-4)*T,b=rnd(4,S-4)*T;if(tile(a,b)!=='water')enemies.push({x:a,y:b,hp:40,max:40,alive:true})}
function say(t){let d=document.createElement('div');d.innerHTML=t;document.getElementById('msgs').appendChild(d);let q=document.getElementById('msgs');q.scrollTop=q.scrollHeight}
function esc(t){return String(t).replace(/[&<>]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[a]))}
function net(o){conns.forEach(q=>{try{q.send(o)}catch(e){}})}
function pd(){return{id:me.id,name:me.name,x:me.x,y:me.y,lvl:me.lvl,color:me.color,hp:me.hp}}
function wire(q){q.on('open',()=>{conns.push(q);q.send({t:'hello',p:pd()});say('<b>SISTEMA:</b> jogador conectado')});q.on('data',d=>{if(d.t==='hello'){remote[d.p.id]=d.p;if(host)q.send({t:'world',p:pd()})}if(d.t==='state')remote[d.p.id]=d.p;if(d.t==='chat'){say('<b>'+esc(d.n)+':</b> '+esc(d.m));net(d)}if(d.t==='hit'){let e=enemies[d.i];if(e&&e.alive){e.hp-=d.d;if(e.hp<=0)e.alive=false}}});q.on('close',()=>{})}
function network(mode){host=mode==='host';peer=new Peer();peer.on('open',id=>{me.id=id;if(host){say('<b>CÓDIGO DA SALA:</b> '+id);alert('Código da sala: '+id+'\nCompartilhe este código com o outro jogador.')}});peer.on('connection',wire);if(!host){let id=prompt('Cole o código da sala:');if(id)wire(peer.connect(id))}}
function start(mode='host'){if(playing)return;me.name=document.getElementById('name').value.trim()||'Explorador';document.getElementById('pname').textContent=me.name;document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='block';playing=true;load();network(mode);say('<b>SISTEMA:</b> Bem-vindo à Neon Frontier.');}
document.getElementById('play').onclick=()=>start();document.getElementById('create').onclick=()=>start('host');document.getElementById('join').onclick=()=>start('join');
onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')attack();if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='m')bag()};onkeyup=e=>keys[e.key.toLowerCase()]=0;
document.querySelectorAll('.mobile button').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.k]=1;b.onpointerup=b.onpointercancel=()=>keys[b.dataset.k]=0});
function xp(n){me.xp+=n;if(me.xp>=100){me.xp-=100;me.lvl++;me.max+=15;me.hp=me.max;say('<b>SISTEMA:</b> Você subiu para o nível '+me.lvl+'!')}hud()}
function attack(){if(!playing||attackTimer>0)return;attackTimer=.35;enemies.forEach((e,i)=>{if(e.alive&&Math.hypot(e.x-me.x,e.y-me.y)<75){e.hp-=20+me.lvl*4;parts.push({x:e.x,y:e.y,t:.3});net({t:'hit',i,d:20+me.lvl*4});if(e.hp<=0){e.alive=false;me.money+=5;xp(25)}}})}
function interact(){let r=items.find(q=>!q.got&&Math.hypot(q.x-me.x,q.y-me.y)<65);if(!r){say('<b>SISTEMA:</b> Nada interessante por perto.');return}r.got=true;me.inv[r.t]++;say('<b>COLETA:</b> '+r.t);if(r.t==='crystal'&&!quest){quest=true;xp(50);document.getElementById('quest').textContent='Cristal encontrado! Missão concluída.';document.getElementById('qprog').textContent='1 / 1'}}
function bag(){say('<b>INVENTÁRIO:</b> 💎 '+me.inv.crystal+' • 🪵 '+me.inv.wood+' • ⛏ '+me.inv.ore+' • 🧪 '+me.inv.potion)}
function save(){localStorage.neonFrontier=JSON.stringify(me);say('<b>SISTEMA:</b> progresso salvo neste aparelho.')}function load(){try{let z=JSON.parse(localStorage.neonFrontier);if(z)Object.assign(me,z)}catch(e){}}
document.getElementById('atk').onclick=attack;document.getElementById('int').onclick=interact;document.getElementById('bag').onclick=bag;document.getElementById('save').onclick=save;
function chat(){let i=document.getElementById('chatin'),m=i.value.trim();if(!m)return;i.value='';say('<b>Você:</b> '+esc(m));net({t:'chat',n:me.name,m})}document.getElementById('send').onclick=chat;document.getElementById('chatin').onkeydown=e=>{if(e.key==='Enter')chat()};
function update(dt){if(!playing)return;let a=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),b=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(a||b){let l=Math.hypot(a,b);a/=l;b/=l;let nx=me.x+a*190*dt,ny=me.y+b*190*dt;if(tile(nx,ny)!=='water'){me.x=Math.max(T,Math.min(S*T-T,nx));me.y=Math.max(T,Math.min(S*T-T,ny))}}attackTimer=Math.max(0,attackTimer-dt);
enemies.forEach(e=>{if(!e.alive)return;let d=Math.hypot(e.x-me.x,e.y-me.y);if(d<240){e.x+=(me.x-e.x)/d*24*dt;e.y+=(me.y-e.y)/d*24*dt}if(d<32&&Math.random()<dt*.8){me.hp-=5;if(me.hp<=0){me.hp=me.max;me.x=S*T/2;me.y=S*T/2;me.money=Math.max(0,me.money-10);say('<b>SISTEMA:</b> Você foi derrotado e perdeu 10 moedas.')}}});parts.forEach(p=>p.t-=dt);while(parts.length&&parts[0].t<=0)parts.shift();cam.x+=(me.x-W/2-cam.x)*.12;cam.y+=(me.y-H/2-cam.y)*.12;net({t:'state',p:pd()});hud()}
function hud(){document.getElementById('level').textContent=me.lvl;document.getElementById('xptext').textContent=me.xp;document.getElementById('hptext').textContent=Math.max(0,Math.floor(me.hp));document.getElementById('money').textContent=me.money;document.getElementById('hp').style.width=me.hp/me.max*100+'%'}
function player(p){x.save();x.translate(p.x,p.y);x.shadowBlur=18;x.shadowColor=p.color;x.fillStyle=p.color;x.beginPath();x.arc(0,0,15,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#06101b';x.fillRect(-7,-3,4,4);x.fillRect(3,-3,4,4);x.fillStyle='#fff';x.font='12px Arial';x.textAlign='center';x.fillText(p.name,0,-22);x.restore()}
function draw(){x.clearRect(0,0,W,H);x.save();x.translate(-cam.x,-cam.y);let sx=Math.floor(cam.x/T)-1,sy=Math.floor(cam.y/T)-1,ex=Math.ceil((cam.x+W)/T)+1,ey=Math.ceil((cam.y+H)/T)+1;for(let yy=sy;yy<=ey;yy++)for(let xx=sx;xx<=ex;xx++){let t=tile(xx*T+2,yy*T+2);x.fillStyle=t==='water'?'#123452':t==='sand'?'#625735':t==='grass'?'#17443a':t==='forest'?'#10322d':'#292c3d';x.fillRect(xx*T,yy*T,T+1,T+1);if(t==='forest'){x.fillStyle='#1b5b48';x.beginPath();x.arc(xx*T+24,yy*T+25,13,0,7);x.fill()}}
items.forEach(r=>{if(r.got)return;x.fillStyle=r.t==='crystal'?'#61f7ff':r.t==='ore'?'#c99cff':'#6fe070';x.shadowBlur=13;x.shadowColor=x.fillStyle;x.beginPath();x.moveTo(r.x,r.y-10);x.lineTo(r.x+8,r.y);x.lineTo(r.x,r.y+10);x.lineTo(r.x-8,r.y);x.fill();x.shadowBlur=0});
enemies.forEach(e=>{if(!e.alive)return;x.fillStyle='#ff4e72';x.beginPath();x.arc(e.x,e.y,16,0,7);x.fill();x.fillStyle='#31101c';x.fillRect(e.x-20,e.y-26,40,5);x.fillStyle='#ff4e72';x.fillRect(e.x-20,e.y-26,40*e.hp/e.max,5)});
Object.values(remote).forEach(player);player(me);parts.forEach(p=>{x.fillStyle='#fff';x.globalAlpha=p.t/.3;x.beginPath();x.arc(p.x+(Math.random()-.5)*20,p.y+(Math.random()-.5)*20,4,0,7);x.fill();x.globalAlpha=1});x.restore();let night=(Math.sin(Date.now()/30000)+1)/2;x.fillStyle='rgba(3,5,28,'+(.15+night*.3)+')';x.fillRect(0,0,W,H);drawMini()}
function drawMini(){let w=mini.clientWidth,h=mini.clientHeight;mx.clearRect(0,0,w,h);mx.fillStyle='#07111d';mx.fillRect(0,0,w,h);for(let yy=0;yy<30;yy++)for(let xx=0;xx<30;xx++){mx.fillStyle=((xx*17+yy*31+Math.floor(seed))%9<2)?'#143d53':'#173c34';mx.fillRect(xx*w/30,yy*h/30,w/30+1,h/30+1)}mx.fillStyle='#62f5ff';mx.beginPath();mx.arc(me.x/(S*T)*w,me.y/(S*T)*h,4,0,7);mx.fill()}
let last=performance.now();function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
