<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8cccf0;touch-action:none;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#title,#status,#hint{position:absolute;background:rgba(0,0,0,.35);color:#fff;border-radius:10px;padding:7px 10px;font-size:12px}
#title{top:14px;left:14px;font-weight:bold}
#status{top:14px;right:14px}
#hint{bottom:18px;left:50%;transform:translateX(-50%);white-space:nowrap}
#look{position:absolute;right:0;top:0;width:65%;height:100%;pointer-events:auto}
#joystick{position:absolute;left:18px;bottom:22px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);pointer-events:auto}
#stick{position:absolute;left:35px;top:35px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.85)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div id="title">RUA 3D • MOTOR LOCAL</div>
<div id="status">CARREGADO</div>
<div id="look"></div>
<div id="joystick"><div id="stick"></div></div>
<div id="hint">Arraste à direita para olhar • joystick para andar</div>
</div>
<script>
(function(){
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
const status=document.getElementById('status');
let W=0,H=0,DPR=1;

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

const FOV=Math.PI/3;
let px=0,pz=14,angle=0;
let joyX=0,joyY=0;
const keys={};
addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);

const objects=[];
function addHouse(x,z,w,d,h,color){
 objects.push({type:'house',x,z,w,d,h,color});
}
function addTree(x,z,s){
 objects.push({type:'tree',x,z,w:.7*s,d:.7*s,h:3.8*s,color:'#4f7d45'});
}
function addPole(x,z){
 objects.push({type:'pole',x,z,w:.18,d:.18,h:7,color:'#777'});
}

const colors=['#d8c19f','#eee8dd','#c98473','#77736f','#6090ad','#aa554a','#d2b6a0'];
[-9,2,13,24,35,46,57].forEach((z,i)=>{
 addHouse(-9,z,6.2,5,3.0+(i%2)*.3,colors[i%colors.length]);
 addHouse(9,z,6.2,5,3.0+((i+1)%2)*.3,colors[(i+3)%colors.length]);
});
addTree(-6.1,-2,.9);addTree(6.1,7,.8);addTree(-6.1,29,1);addTree(6.1,43,.85);
addPole(-5.8,-12);addPole(5.8,8);addPole(-5.8,31);addPole(5.8,54);

function norm(a){return Math.atan2(Math.sin(a),Math.cos(a))}
function project(o){
 let dx=o.x-px,dz=o.z-pz;
 let dist=Math.hypot(dx,dz);
 let rel=norm(Math.atan2(dx,-dz)-angle);
 if(Math.abs(rel)>FOV*.72)return null;
 let depth=dist*Math.cos(rel);
 if(depth<.15)return null;
 let sx=W/2+Math.tan(rel)/(Math.tan(FOV/2))*W/2;
 return {dist,depth,sx};
}

function render(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#8cccf0';ctx.fillRect(0,0,W,H*.52);
 ctx.fillStyle='#86a878';ctx.fillRect(0,H*.52,W,H*.48);

 // rua
 const horizon=H*.52;
 ctx.fillStyle='#555';
 ctx.beginPath();
 ctx.moveTo(W*.36,horizon);ctx.lineTo(W*.64,horizon);ctx.lineTo(W*.93,H);ctx.lineTo(W*.07,H);ctx.closePath();ctx.fill();

 // calçadas
 ctx.fillStyle='#bdb8ad';
 ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W*.36,horizon);ctx.lineTo(W*.07,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(W*.64,horizon);ctx.lineTo(W,horizon);ctx.lineTo(W,H);ctx.lineTo(W*.93,H);ctx.closePath();ctx.fill();

 // linha central
 ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;
 ctx.setLineDash([20,22]);ctx.beginPath();ctx.moveTo(W/2,horizon);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);

 const visible=objects.map(o=>({o,p:project(o)})).filter(x=>x.p).sort((a,b)=>b.p.dist-a.p.dist);

 for(const item of visible){
   const o=item.o,p=item.p;
   const scale=H/p.depth;
   if(o.type==='house'){
     const half=o.w/2;
     const left=projectPoint(o.x-half,o.z,o);
     const right=projectPoint(o.x+half,o.z,o);
     const width=Math.max(8,Math.abs(right-left));
     const height=Math.min(H*2,o.h*scale*.72);
     const bottom=horizon+(H-horizon)*Math.min(1,35/(p.depth+35));
     const top=bottom-height;
     ctx.fillStyle=o.color;
     ctx.fillRect(p.sx-width/2,top,width,height);
     ctx.fillStyle='rgba(255,255,255,.75)';
     ctx.fillRect(p.sx-width*.26,top+height*.34,width*.18,height*.22);
     ctx.fillStyle='#353535';
     ctx.fillRect(p.sx+width*.08,top+height*.30,width*.25,height*.70);
     ctx.fillStyle='rgba(0,0,0,.18)';
     ctx.fillRect(p.sx-width/2,top,width,Math.max(3,height*.035));
   }else if(o.type==='tree'){
     const r=Math.max(3,scale*.75);
     const bottom=horizon+(H-horizon)*Math.min(1,30/(p.depth+30));
     ctx.fillStyle='#684a35';ctx.fillRect(p.sx-r*.12,bottom-r*2.5,r*.24,r*2.5);
     ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(p.sx,bottom-r*2.7,r,0,Math.PI*2);ctx.fill();
     ctx.fillStyle='#63864e';ctx.beginPath();ctx.arc(p.sx+r*.45,bottom-r*3,r*.65,0,Math.PI*2);ctx.fill();
   }else{
     const h=Math.min(H*1.3,scale*o.h*.72);
     const bottom=horizon+(H-horizon)*Math.min(1,30/(p.depth+30));
     ctx.fillStyle='#777';ctx.fillRect(p.sx-2,bottom-h,4,h);
     ctx.fillStyle='#333';ctx.fillRect(p.sx-14,bottom-h,28,3);
   }
 }
}

function projectPoint(x,z,o){
 const dx=x-px,dz=z-pz;
 const rel=norm(Math.atan2(dx,-dz)-angle);
 return W/2+Math.tan(rel)/(Math.tan(FOV/2))*W/2;
}

let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 let f=0,s=0;
 if(keys.KeyW||keys.ArrowUp)f++;
 if(keys.KeyS||keys.ArrowDown)f--;
 if(keys.KeyA||keys.ArrowLeft)s--;
 if(keys.KeyD||keys.ArrowRight)s++;
 f+=-joyY;s+=joyX;
 const len=Math.hypot(f,s);if(len>1){f/=len;s/=len}
 const speed=4.0*dt;
 px+=(Math.sin(angle)*f+Math.cos(angle)*s)*speed;
 pz+=(-Math.cos(angle)*f+Math.sin(angle)*s)*speed;
 px=Math.max(-5.7,Math.min(5.7,px));
 pz=Math.max(-68,Math.min(68,pz));
 render();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// olhar
const look=document.getElementById('look');
let lookId=null,lastX=0;
look.addEventListener('pointerdown',e=>{
 lookId=e.pointerId;lastX=e.clientX;look.setPointerCapture(e.pointerId);
});
look.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookId)return;
 angle+=(e.clientX-lastX)*.005;
 lastX=e.clientX;
});
look.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});
look.addEventListener('pointercancel',e=>{if(e.pointerId===lookId)lookId=null});

// joystick
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');
let joyId=null;
function joyMove(e){
 const r=joy.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const max=34,l=Math.hypot(dx,dy);
 if(l>max){dx=dx/l*max;dy=dy/l*max}
 joyX=dx/max;joyY=dy/max;
 stick.style.transform='translate('+dx+'px,'+dy+'px)';
}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
function joyEnd(e){
 if(e.pointerId!==joyId)return;
 joyId=null;joyX=joyY=0;stick.style.transform='translate(0,0)';
}
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);

status.textContent='CENA CARREGADA';
})();
</script>
</body>
</html>
