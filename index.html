<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fcbea;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0} canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.38);color:#fff;font-size:14px;font-weight:700}
#look{position:absolute;right:0;top:0;width:66%;height:100%;pointer-events:auto}
#joystick{position:absolute;left:18px;bottom:max(20px,env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.42);pointer-events:auto}
#stick{position:absolute;width:58px;height:58px;left:33px;top:33px;border-radius:50%;background:rgba(255,255,255,.76);box-shadow:0 3px 15px rgba(0,0,0,.25)}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.35);color:#fff;font-size:12px;white-space:nowrap}
#map{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:112px;height:112px;border-radius:14px;background:rgba(255,255,255,.9);border:2px solid rgba(0,0,0,.15);overflow:hidden}
#map:before{content:"";position:absolute;left:43%;top:-15%;width:22px;height:140%;background:#aaa;transform:rotate(28deg)}
#map:after{content:"";position:absolute;top:48%;left:-15%;width:140%;height:18px;background:#aaa;transform:rotate(-28deg)}
#dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#1677ff;border:2px solid white;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}
@media(min-width:800px){#joystick{left:28px;bottom:28px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="title">RUA 3D • PRIMEIRA PESSOA</div>
  <div id="map"><div id="dot"></div></div>
  <div id="look"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="hint">Arraste à direita para olhar • joystick para andar</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.min.js"></script>
<script>

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fcbea);
scene.fog=new THREE.Fog(0x9fcbea,85,210);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,280);
camera.position.set(0,1.68,34);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('game').appendChild(renderer.domElement);


function makeTex(base, noise=18, speck=0){
  const c=document.createElement('canvas'); c.width=128; c.height=128;
  const g=c.getContext('2d'); g.fillStyle=base; g.fillRect(0,0,128,128);
  const img=g.getImageData(0,0,128,128);
  for(let i=0;i<img.data.length;i+=4){
    const n=(Math.random()-.5)*noise;
    img.data[i]=Math.max(0,Math.min(255,img.data[i]+n));
    img.data[i+1]=Math.max(0,Math.min(255,img.data[i+1]+n));
    img.data[i+2]=Math.max(0,Math.min(255,img.data[i+2]+n));
  }
  g.putImageData(img,0,0);
  if(speck){
    for(let i=0;i<speck;i++){
      g.fillStyle='rgba(40,35,30,'+(0.04+Math.random()*0.12)+')';
      g.beginPath();g.arc(Math.random()*128,Math.random()*128,Math.random()*2.2+.3,0,Math.PI*2);g.fill();
    }
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(2.5,2.5); return t;
}
function material(base,noise=18,speck=0,repeatX=2.5,repeatY=2.5){
  const t=makeTex(base,noise,speck); t.repeat.set(repeatX,repeatY);
  return new THREE.MeshBasicMaterial({map:t});
}
const TEX={
  road:material('#505050',12,55,10,45),
  concrete:material('#c7c1b7',14,85,5,45),
  curb:material('#d8d5cc',8,35,4,20),
  white:material('#e5dfd5',11,55,2.5,2.5),
  cream:material('#d5c1a5',14,65,2.5,2.5),
  pink:material('#c98375',13,60,2.5,2.5),
  salmon:material('#c36b5d',13,60,2.5,2.5),
  gray:material('#77736f',15,70,2.5,2.5),
  blue:material('#4c87ad',13,60,2.5,2.5),
  red:material('#a94a42',13,55,2.5,2.5),
  gate:material('#55565a',9,20,3,3),
  metal:material('#6a6c6c',7,15,3,3),
  glass:material('#405b64',8,8,2,2),
  wood:material('#79513b',18,35,2,4),
  tile:material('#934f38',18,45,5,3),
  roofDark:material('#62483a',18,45,5,3),
  green:material('#4d7542',30,70,2,2),
  leaf2:material('#63814d',28,70,2,2)
};

const M={
 road:TEX.road,
 asphalt2:material('#585858',12,50,10,5),
 concrete:TEX.concrete,
 curb:TEX.curb,
 white:TEX.white,
 cream:TEX.cream,
 pink:TEX.pink,
 salmon:TEX.salmon,
 gray:TEX.gray,
 blue:TEX.blue,
 red:TEX.red,
 darkGate:TEX.gate,
 metal:TEX.metal,
 glass:TEX.glass,
 wood:TEX.wood,
 tile:TEX.tile,
 roofDark:TEX.roofDark,
 green:TEX.green,
 leaf2:TEX.leaf2,
 wire:new THREE.MeshBasicMaterial({color:0x222222}),
 black:new THREE.MeshBasicMaterial({color:0x202020})
};

function box(w,h,d,x,y,z,m){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);scene.add(o);return o;
}
function plane(w,h,x,y,z,rotY,m){
 const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);
 o.position.set(x,y,z);o.rotation.y=rotY;scene.add(o);return o;
}
function cylinder(r,h,x,y,z,m,radial=10){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,radial),m);
 o.position.set(x,y,z);scene.add(o);return o;
}
function roofSlab(x,z,w,d,y,m){
 box(w,.22,d,x,y,z,m);
}
function gate(x,y,z,w,h,m,rot=0){
 const g=box(w,h,.13,x,y,z,m);g.rotation.y=rot;
 // barras verticais discretas
 for(let i=-Math.floor(w/.42);i<=Math.floor(w/.42);i++){
   const b=box(.045,h*.92,.16,x+i*.42,y,z-.02,M.metal);b.rotation.y=rot;
 }
}
function window(x,y,z,w,h,rot=0){
 const frame=box(w+.22,h+.22,.12,x,y,z,M.white);frame.rotation.y=rot;
 const glass=box(w,h,.14,x,y,z-.04,M.glass);glass.rotation.y=rot;
}
function pillar(x,y,z,w,h,m=M.concrete){
 box(w,h,w,x,y,z,m);
}
function wallSegment(x,z,w,h,d,m){
 box(w,h,d,x,h/2,z,m);
}

function facadeDetail(x,z,w,h,wall,front,style){
  if(style===0){
    for(let i=0;i<5;i++) box(.055,h*.75,.12,x-w*.36+i*w*.18,.82,front-.08,M.metal);
    box(w*.72,.12,.12,x,.55,front-.1,M.metal);
  } else if(style===1){
    box(2.0,.95,.13,x,1.05,front-.11,M.glass);
    for(let i=-2;i<=2;i++) box(.05,.9,.15,x+i*.38,1.05,front-.15,M.metal);
  } else {
    box(.95,1.8,.11,x-.55,1.02,front-.11,M.wood);
    window(x+.72,1.72,front-.11,1.15,.9);
  }
}
function detailedHouse(cfg){
  const {x,z,w,depth,h,wall,gateM,roofM,windows=true,gateX=0,style=0}=cfg;
  box(w,h,depth,x,h/2,z,wall);
  box(w+.16,.34,depth+.12,x,h+.17,z,wall);
  roofSlab(x,z,w+.35,depth+.3,h+.38,roofM);
  const front=z-depth/2-.08, gap=2.8;
  const sideW=(w-gap)/2;
  wallSegment(x-(gap/2+sideW/2),front,sideW,.92,.28,wall);
  wallSegment(x+(gap/2+sideW/2),front,sideW,.92,.28,wall);
  pillar(x-gap/2,.95,front,.28,1.9,M.concrete);
  pillar(x+gap/2,.95,front,.28,1.9,M.concrete);
  gate(x+gateX,1.05,front-.08,gap,2.08,gateM);
  facadeDetail(x+gateX,z,w,h,wall,front,style);
  if(windows){
    window(x-w*.25,1.76,front-.08,1.18,.98);
    if(style!==2) window(x+w*.18,1.76,front-.08,1.18,.98);
  }
  box(.12,h-.45,.22,x-w/2-.03,(h-.45)/2+.15,z,M.curb);
  box(.12,h-.45,.22,x+w/2+.03,(h-.45)/2+.15,z,M.curb);
}


// Rua e calçadas com largura mais próxima das fotos.
box(12,.16,190,0,0,0,M.road);
box(31,.16,11,0,.01,-25,M.asphalt2);
box(7.0,.12,190,-9.45,.08,0,M.concrete);
box(7.0,.12,190,9.45,.08,0,M.concrete);
box(31,.12,2.6,0,.08,-19.2,M.concrete);
box(31,.12,2.6,0,.08,-30.8,M.concrete);

// Meio-fio.
box(.25,.24,190,-6.05,.18,0,M.curb);
box(.25,.24,190,6.05,.18,0,M.curb);
box(31,.24,.25,0,.18,-18.0,M.curb);
box(31,.24,.25,0,.18,-32.0,M.curb);

// Pequenas juntas e faixas de concreto nas calçadas.
for(let z=-75;z<80;z+=8){
 box(6.95,.035,.07,-9.45,.145,z,M.curb);
 box(6.95,.035,.07,9.45,.145,z,M.curb);
}

// Casas modeladas individualmente, cada fachada com proporções, portão, janela e detalhes próprios.
function individualHouse(i,x,z,side){
  const specs=[
    {w:7.4,depth:5.0,h:3.35,wall:M.cream,gateM:M.darkGate,roofM:M.white,gateX:-.15,style:0},
    {w:6.8,depth:5.4,h:3.05,wall:M.white,gateM:M.metal,roofM:M.gray,gateX:.25,style:1},
    {w:7.7,depth:4.8,h:3.7,wall:M.salmon,gateM:M.darkGate,roofM:M.roofDark,gateX:-.35,style:2},
    {w:6.9,depth:5.8,h:3.2,wall:M.gray,gateM:M.metal,roofM:M.white,gateX:.35,style:0},
    {w:7.6,depth:5.1,h:3.45,wall:M.pink,gateM:M.darkGate,roofM:M.tile,gateX:0,style:1},
    {w:6.6,depth:5.6,h:3.0,wall:M.blue,gateM:M.metal,roofM:M.gray,gateX:-.2,style:2}
  ];
  const s=specs[i%specs.length];
  detailedHouse({...s,x,z,windows:true});
  // Entrada/recuo individual, para evitar fachadas todas iguais.
  const front=z-s.depth/2-.22;
  if(i%3===0){
    box(s.w*.75,.06,1.15,x,.18,front-.55,M.curb);
  }else if(i%3===1){
    box(1.8,.08,1.5,x+s.w*.22,.2,front-.72,M.concrete);
  }else{
    box(2.6,.07,.9,x-s.w*.18,.19,front-.45,M.tile);
  }
  // Pequeno detalhe de fachada variando por casa.
  if(i%2===0){
    box(.55,.7,.08,x-s.w*.38,1.05,front-.16,M.metal);
  }else{
    box(.8,.18,.08,x+s.w*.32,2.65,front-.16,M.white);
  }
}
const leftZ=[-11,0,11,23,36,50];
const rightZ=[-11,0,11,23,36,50];
leftZ.forEach((z,i)=>individualHouse(i,-9.4,z,'L'));
rightZ.forEach((z,i)=>individualHouse(i+6,9.4,z,'R'));

// Muros baixos extras, como nas fotos.
wallSegment(-9.4,-7,7.0,.8,.22,M.salmon);
wallSegment(9.4,-7,7.0,.8,.22,M.cream);
wallSegment(-9.4,17,7.0,.75,.22,M.white);
wallSegment(9.4,17,7.0,.8,.22,M.gray);

// Árvores mais próximas do formato das referências.
function tree(x,z,s=1){
 cylinder(.16*s,2.3*s,x,1.15*s,z,M.wood,8);
 const a=new THREE.Mesh(new THREE.SphereGeometry(1.2*s,9,7),M.green);
 a.position.set(x,2.75*s,z);scene.add(a);
 const b=new THREE.Mesh(new THREE.SphereGeometry(.82*s,8,7),M.leaf2);
 b.position.set(x+.55*s,2.55*s,z+.1*s);scene.add(b);
}
tree(-6.8,-1,.95);tree(6.8,5,.8);tree(-6.8,29,1.05);tree(6.8,43,.85);

// Postes mais altos e com braços/cabos visíveis.
function pole(x,z){
 box(.16,7.4,.16,x,3.7,z,M.concrete);
 box(2.2,.13,.13,x+(.85),6.65,z,M.metal);
 box(.13,.13,1.2,x+1.75,6.55,z,M.metal);
 // cabo longitudinal, fino, sem iluminação
}
pole(-5.45,-14);pole(5.45,7);pole(-5.45,31);pole(5.45,54);

// Cabos longos acompanhando a rua.
function cable(x,z,y=6.6){
 const c=curveTube(new THREE.Vector3(x,y,z-70),new THREE.Vector3(x,y-.35,z+70),.018,M.wire);
}
function curveTube(a,b,r,m){
 const pts=[a.clone(),new THREE.Vector3(a.x,(a.y+b.y)/2-.35,(a.z+b.z)/2),b.clone()];
 const curve=new THREE.CatmullRomCurve3(pts);
 const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,20,r,5,false),m);
 scene.add(mesh);return mesh;
}
curveTube(new THREE.Vector3(-5.45,6.6,-75),new THREE.Vector3(-5.45,6.25,75),.018,M.wire);
curveTube(new THREE.Vector3(5.45,6.45,-75),new THREE.Vector3(5.45,6.15,75),.018,M.wire);

// Controles.
const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');
let joyId=null,joyX=0,joyY=0;
function setJoy(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=34;
 let dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy);
 if(len>max){dx*=max/len;dy*=max/len}
 stick.style.transform=`translate(${dx}px,${dy}px)`;joyX=dx/max;joyY=dy/max;
}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});
function endJoy(e){if(e.pointerId!==joyId)return;joyId=null;joyX=joyY=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);

const look=document.getElementById('look');
let lookId=null,lastX=0,lastY=0,yaw=0,pitch=0;
look.addEventListener('pointerdown',e=>{lookId=e.pointerId;look.setPointerCapture(e.pointerId);lastX=e.clientX;lastY=e.clientY});
look.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookId)return;
 yaw-=(e.clientX-lastX)*.0042;pitch-=(e.clientY-lastY)*.0032;
 pitch=Math.max(-1.22,Math.min(1.22,pitch));lastX=e.clientX;lastY=e.clientY;
});
look.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});
look.addEventListener('pointercancel',e=>{if(e.pointerId===lookId)lookId=null});

const clock=new THREE.Clock();
function update(dt){
 let f=0,s=0;
 if(keys.KeyW||keys.ArrowUp)f++;if(keys.KeyS||keys.ArrowDown)f--;
 if(keys.KeyA||keys.ArrowLeft)s--;if(keys.KeyD||keys.ArrowRight)s++;
 f+=-joyY;s+=joyX;const n=Math.hypot(f,s);if(n>1){f/=n;s/=n}
 const speed=4.8*dt;
 const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 camera.position.addScaledVector(dir,f*speed);camera.position.addScaledVector(right,s*speed);
 camera.position.x=Math.max(-5.05,Math.min(5.05,camera.position.x));
 camera.position.z=Math.max(-72,Math.min(72,camera.position.z));
 camera.position.y=1.68;
 camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
}
function animate(){requestAnimationFrame(animate);update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
