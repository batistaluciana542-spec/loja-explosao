<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd0ea;touch-action:none;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#look{position:fixed;right:0;top:0;width:70%;height:100%;z-index:5}
#joy{position:fixed;left:18px;bottom:18px;width:140px;height:140px;border:2px solid #ffffffaa;border-radius:50%;background:#17202b55;z-index:10;box-shadow:0 4px 20px #0005}
#knob{position:absolute;left:44px;top:44px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 3px 10px #0006}
</style></head><body><canvas id="game"></canvas><div id="look"></div><div id="joy"><div id="knob"></div></div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,D=1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener("resize",resize);resize();

const C={x:0,z:-1,yaw:0,pitch:0,cameraH:2.35};
let jx=0,jy=0,drag=false,lx=0,ly=0,last=performance.now();

const houses=[
 {x:-10.2,z:8,w:5.8,d:7.2,h:3.15,wall:"#d9c3a7",side:"#b99a78",roof:"#7a4b36",door:"#5a382b",win:"#9fc8d1",trim:"#eee4d4",gate:"#5b5148",style:0},
 {x:-10.2,z:21,w:6.1,d:7.6,h:3.25,wall:"#e1b2a7",side:"#b97f78",roof:"#684033",door:"#56342c",win:"#a7cbd0",trim:"#f2ded7",gate:"#5c514b",style:1},
 {x:-10.2,z:35,w:5.9,d:7.1,h:3.2,wall:"#e5e0d7",side:"#c3beb4",roof:"#66544b",door:"#514039",win:"#9fc5cb",trim:"#ffffff",gate:"#77716a",style:2},
 {x:-10.2,z:49,w:6.2,d:7.5,h:3.15,wall:"#d5b898",side:"#b08f6d",roof:"#704632",door:"#52362b",win:"#a6c8cc",trim:"#eee0c8",gate:"#5d5146",style:3},
 {x:10.2,z:10,w:5.8,d:7.2,h:3.15,wall:"#dfd2b7",side:"#bbaa89",roof:"#704634",door:"#50362d",win:"#9fc5ca",trim:"#f5ead5",gate:"#62584d",style:1},
 {x:10.2,z:24,w:6.1,d:7.6,h:3.25,wall:"#d7a27d",side:"#b57d5f",roof:"#674334",door:"#50352b",win:"#a2c9cf",trim:"#f0d9c3",gate:"#5b5048",style:0},
 {x:10.2,z:38,w:5.9,d:7.1,h:3.2,wall:"#dedbd3",side:"#bbb8b0",roof:"#695148",door:"#504039",win:"#a1c7cd",trim:"#f5f2eb",gate:"#6e6962",style:2},
 {x:10.2,z:52,w:6.2,d:7.5,h:3.15,wall:"#d8b58f",side:"#b18c6c",roof:"#6c4434",door:"#51362c",win:"#a7c9ce",trim:"#f0dfca",gate:"#5e5248",style:3}
];
const trees=[[-4.7,6],[-4.7,17],[-4.7,29],[-4.7,42],[-4.7,55],[4.7,12],[4.7,26],[4.7,40],[4.7,54]];
const poles=[[-4.0,4],[-4.0,19],[-4.0,34],[-4.0,49],[4.0,12],[4.0,28],[4.0,44],[4.0,59]];

function shade(hex,n){let v=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(v>>16)+n)),g=Math.max(0,Math.min(255,((v>>8)&255)+n)),b=Math.max(0,Math.min(255,(v&255)+n));return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("")}
function cam(x,z){let dx=x-C.x,dz=z-C.z,co=Math.cos(C.yaw),si=Math.sin(C.yaw);return{f:dx*si+dz*co,s:dx*co-dz*si}}
function proj(x,z,h=0){
 let q=cam(x,z);
 if(q.f<.35)return null;
 const focal=Math.min(W,H)*.92;
 const pitchF=Math.sin(C.pitch)*focal;
 const pitchC=Math.cos(C.pitch);
 const vertical=(h-C.cameraH)*pitchC-q.f*Math.sin(C.pitch);
 const depth=q.f*pitchC+h*Math.sin(C.pitch);
 if(depth<=.25)return null;
 const scale=focal/depth;
 return{x:W/2+q.s*scale,y:H*.53-vertical*scale,s:scale,d:q.f};
}
function poly(points,fill){if(points.some(p=>!p))return;ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fill()}
function line(points,stroke,width=1){if(points.some(p=>!p))return;ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.stroke()}

/* NOVO CHÃO: uma malha de faixas longitudinais, sem um grande retângulo verde
   que invade o céu quando a câmera sobe. A rua, calçada e gramado são desenhados
   como superfícies independentes, sempre abaixo do horizonte. */
function ground(){
 ctx.fillStyle="#9bd0ea";ctx.fillRect(0,0,W,H);
 const horizon=Math.max(0,Math.min(H,H*.53+Math.sin(C.pitch)*Math.min(W,H)*.92));
 ctx.fillStyle="#86a66b";ctx.fillRect(0,horizon,W,H-horizon);

 const strips=[[-5.4,-3.65,"#c5beb2"],[-3.65,3.65,"#55575a"],[3.65,5.4,"#c5beb2"]];

 // O chão existe para os dois lados da posição do jogador, mas cada
 // trecho só é desenhado quando está na frente da câmera. Assim não há
 // duplicação nem sobreposição quando o jogador olha para trás.
 for(let z=C.z-220;z<C.z+220;z+=2.2){
   for(const [l,r,col] of strips){
     const a=proj(l,z),b=proj(r,z),c1=proj(r,z+2.2),d=proj(l,z+2.2);
     if(a&&b&&c1&&d)poly([a,b,c1,d],col);
   }
 }

 // Bordas somente dos trechos visíveis.
 for(const x of [-3.65,3.65]){
   for(let z=C.z-220;z<C.z+220;z+=1.5){
     const a=proj(x,z),b=proj(x,z+1.5);
     if(a&&b)line([a,b],"#8b8d8d",1);
   }
 }

 // Faixa central, nos dois sentidos, sem duplicar.
 for(let z=C.z-220;z<C.z+220;z+=8){
   const a=proj(-.08,z),b=proj(.08,z),c1=proj(.08,z+3.4),d=proj(-.08,z+3.4);
   if(a&&b&&c1&&d)poly([a,b,c1,d],"#e3d36c");
 }

 // Juntas das calçadas.
 for(let z=C.z-220;z<C.z+220;z+=8){
   let a=proj(-5.35,z),b=proj(-3.7,z);
   if(a&&b)line([a,b],"#aaa59b",.7);
   a=proj(3.7,z);b=proj(5.35,z);
   if(a&&b)line([a,b],"#aaa59b",.7);
 }
}
/* NOVAS CASAS: cada casa é um volume fechado com quatro paredes, beiral,
   telhado de duas águas, porta recuada visualmente, janelas com moldura,
   muro frontal e pequeno jardim. Nada de fachada solta. */
function house(h){
 const x1=h.x-h.w/2,x2=h.x+h.w/2,z1=h.z-h.d/2,z2=h.z+h.d/2;
 const Hh=h.h,roofH=Hh+.72;
 const verts=[
  [x1,z1,0],[x2,z1,0],[x2,z2,0],[x1,z2,0],
  [x1,z1,Hh],[x2,z1,Hh],[x2,z2,Hh],[x1,z2,Hh],
  [h.x,z1,roofH],[h.x,z2,roofH]
 ];

 // Projeção própria das casas: não deixa uma única quina inválida
 // apagar a face inteira. O renderer principal continua intocado.
 function hp(x,z,hv=0){
   const q=cam(x,z);
   const focal=Math.min(W,H)*.92;
   const pc=Math.cos(C.pitch);
   const safeF=Math.max(q.f,.36);
   const vertical=(hv-C.cameraH)*pc-q.f*Math.sin(C.pitch);
   const depth=Math.max(safeF*pc+hv*Math.sin(C.pitch),.26);
   const scale=focal/depth;
   return{x:W/2+q.s*scale,y:H*.53-vertical*scale,s:scale,d:q.f};
 }
 const p=verts.map(v=>hp(v[0],v[1],v[2]));

 const faces=[
  {ids:[0,1,5,4],fill:h.wall},
  {ids:[1,2,6,5],fill:h.side},
  {ids:[2,3,7,6],fill:shade(h.side,-22)},
  {ids:[3,0,4,7],fill:shade(h.side,-16)}
 ];

 faces.sort((a,b)=>{
   let da=0,db=0;
   for(const id of a.ids)da+=p[id].d;
   for(const id of b.ids)db+=p[id].d;
   return db/a.ids.length-da/b.ids.length;
 });
 for(const f of faces)poly(f.ids.map(id=>p[id]),f.fill);

 // PAREDE DA CASA VOLTADA PARA A RUA.
// Esta lateral tem espessura real, para não parecer que a casa está
// aberta ou sem parede quando vista do meio da rua.
 const streetX = h.x < 0 ? x2 : x1;
 const streetSide = h.x < 0 ? shade(h.side,-6) : h.side;
 const thickness = h.x < 0 ? .16 : -.16;
 const outerX = streetX + thickness;

 const sw1=hp(streetX,z1,0),sw2=hp(streetX,z2,0),sw3=hp(streetX,z2,Hh),sw4=hp(streetX,z1,Hh);
 const ow1=hp(outerX,z1,0),ow2=hp(outerX,z2,0),ow3=hp(outerX,z2,Hh),ow4=hp(outerX,z1,Hh);

 // Face inteira da parede.
 poly([sw1,sw2,sw3,sw4],streetSide);

 // Espessura nas duas pontas da parede.
 poly([sw1,ow1,ow4,sw4],shade(streetSide,-14));
 poly([sw2,ow2,ow3,sw3],shade(streetSide,8));

 // Linha externa discreta para marcar a quina 3D.
 line([ow1,ow2,ow3,ow4,ow1],shade(streetSide,-28),Math.max(1.2,sw1.s*.018));

 // PROJEÇÃO PRÓPRIA DO TETO
 // O telhado não usa mais a projeção das paredes. Cada vértice é
 // projetado separadamente e as águas são ordenadas pela profundidade.
 function roofPoint(x,z,hv){
   const q=cam(x,z);
   const focal=Math.min(W,H)*.92;
   const pc=Math.cos(C.pitch);
   const safeF=Math.max(q.f,.36);
   const vertical=(hv-C.cameraH)*pc-q.f*Math.sin(C.pitch);
   const depth=Math.max(safeF*pc+hv*Math.sin(C.pitch),.26);
   const scale=focal/depth;
   return{x:W/2+q.s*scale,y:H*.53-vertical*scale,s:scale,d:q.f};
 }
 const roofFaces=[
   {pts:[roofPoint(x1,z1,Hh),roofPoint(x2,z1,Hh),roofPoint(h.x,z1,roofH)],fill:shade(h.roof,4)},
   {pts:[roofPoint(h.x,z1,roofH),roofPoint(x2,z1,Hh),roofPoint(x2,z2,Hh),roofPoint(h.x,z2,roofH)],fill:h.roof},
   {pts:[roofPoint(h.x,z2,roofH),roofPoint(x2,z2,Hh),roofPoint(x1,z2,Hh)],fill:shade(h.roof,-10)},
   {pts:[roofPoint(x1,z2,Hh),roofPoint(h.x,z2,roofH),roofPoint(h.x,z1,roofH),roofPoint(x1,z1,Hh)],fill:shade(h.roof,-14)}
 ];
 roofFaces.sort((a,b)=>{
   const da=a.pts.reduce((s,v)=>s+v.d,0)/a.pts.length;
   const db=b.pts.reduce((s,v)=>s+v.d,0)/b.pts.length;
   return db-da;
 });
 for(const f of roofFaces)poly(f.pts,f.fill);

 // Fachada mais próxima. Os detalhes ficam sobre uma parede
 // completa, para a casa nunca parecer vazada do lado do jogador.
 const q=cam(h.x,h.z);
 const front=q.f>=0;
 const facadeZ=front?z1-.012:z2+.012;

 // Parede frontal sólida atrás da porta e das janelas.
 const wallZ=front?z1:z2;
 const wp1=hp(x1,wallZ,0),wp2=hp(x2,wallZ,0),wp3=hp(x2,wallZ,Hh),wp4=hp(x1,wallZ,Hh);
 poly([wp1,wp2,wp3,wp4],h.wall);

 function panel(cx,cy,w,hgt,fill,border){
   const p1=hp(cx-w/2,facadeZ,cy-hgt/2);
   const p2=hp(cx+w/2,facadeZ,cy-hgt/2);
   const p3=hp(cx+w/2,facadeZ,cy+hgt/2);
   const p4=hp(cx-w/2,facadeZ,cy+hgt/2);
   poly([p1,p2,p3,p4],fill);
   if(border)line([p1,p2,p3,p4,p1],border,Math.max(1,p1.s*.012));
   return{p1,p2,p3,p4};
 }

 hp;
 panel(h.x-.72,1.0,.82,1.75,h.door,"#3a2a24");
 const win1=panel(h.x+.72,2.02,1.12,.78,h.win,h.trim);
 const win2=panel(h.x-.72,2.08,.82,.66,h.win,h.trim);

 function cross(w){
   const mx=(w.p1.x+w.p2.x)/2,my=(w.p1.y+w.p3.y)/2;
   line([{x:mx,y:w.p1.y},{x:mx,y:w.p3.y}],"#52666a",Math.max(1,w.p1.s*.008));
   line([{x:w.p1.x,y:my},{x:w.p2.x,y:my}],"#52666a",Math.max(1,w.p1.s*.008));
 }
 cross(win1);cross(win2);

 if(h.style===0||h.style===3){
   panel(h.x+1.55,.72,.9,1.0,h.gate||"#5a514a","#393735");
 }

 const mz=front?z1-.46:z2+.46;
 function wallSeg(aa,bb){
   const p1=hp(aa,mz,0),p2=hp(bb,mz,0),p3=hp(bb,mz,.5),p4=hp(aa,mz,.5);
   poly([p1,p2,p3,p4],shade(h.wall,-30));
 }
 wallSeg(x1-.28,h.x-1.08);
 wallSeg(h.x+1.08,x2+.28);
}
function tree(x,z){
 const base=proj(x,z,0), trunkTop=proj(x,z,3.0);
 if(!base||!trunkTop)return;

 // Tronco realmente espesso e proporcional à árvore.
 const tw=Math.max(14,base.s*.58);
 line([base,trunkTop],"#5a3d29",tw);

 // Galhos grossos entrando na copa.
 const branchW=Math.max(8,base.s*.20);
 const left=proj(x-.62,z,3.45), right=proj(x+.62,z,3.45);
 if(left)line([trunkTop,left],"#5a3d29",branchW);
 if(right)line([trunkTop,right],"#5a3d29",branchW);

 // Copa larga, irregular e cheia, com vários volumes.
 const blobs=[
  [-.82,2.85,.82,"#315a34"],[.82,2.85,.82,"#315a34"],
  [-.62,3.35,.98,"#3b6b3b"],[.62,3.35,.98,"#3b6b3b"],
  [0,3.45,1.12,"#477b42"],[-.72,3.85,.82,"#477b42"],
  [.72,3.85,.82,"#477b42"],[0,4.05,1.0,"#53884b"],
  [-.35,4.35,.62,"#649657"],[.42,4.3,.64,"#5d9152"]
 ];
 for(const [ox,oy,r,col] of blobs){
   const q=proj(x+ox,z,oy); if(!q)continue;
   const R=Math.max(12,q.s*r);
   ctx.fillStyle=col;
   ctx.beginPath();ctx.arc(q.x,q.y,R,0,Math.PI*2);ctx.fill();
 }
}
function pole(x,z){
 let a=proj(x,z,0),b=proj(x,z,5.6);if(!a||!b)return;
 line([a,b],"#555b5d",Math.max(2,a.s*.028));
 let cap=proj(x,z,5.65);if(cap){ctx.fillStyle="#4e5354";ctx.fillRect(cap.x-cap.s*.2,cap.y-cap.s*.025,cap.s*.4,Math.max(2,cap.s*.05))}
}
function render(){
 ground();
 const list=[];
 houses.forEach(h=>{let q=proj(h.x,h.z,0);if(q)list.push([q.d,()=>house(h)])});
 trees.forEach(v=>{let q=proj(v[0],v[1],0);if(q)list.push([q.d,()=>tree(v[0],v[1])])});
 poles.forEach(v=>{let q=proj(v[0],v[1],0);if(q)list.push([q.d,()=>pole(v[0],v[1])])});
 list.sort((a,b)=>b[0]-a[0]);list.forEach(v=>v[1]());
 requestAnimationFrame(render);
}
render();

const joy=document.getElementById("joy"),knob=document.getElementById("knob");
function moveJoy(e){const r=joy.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=43,n=Math.hypot(x,y);if(n>m){x=x/n*m;y=y/n*m}jx=x/m;jy=y/m;knob.style.transform="translate("+x+"px,"+y+"px)"}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)};joy.onpointermove=e=>{if(joy.hasPointerCapture(e.pointerId))moveJoy(e)};
function stopJoy(){jx=0;jy=0;knob.style.transform="translate(0,0)"}joy.onpointerup=joy.onpointercancel=stopJoy;

const look=document.getElementById("look");
look.onpointerdown=e=>{look.setPointerCapture(e.pointerId);drag=true;lx=e.clientX;ly=e.clientY};
look.onpointermove=e=>{if(!drag)return;C.yaw-=(lx-e.clientX)*.004;C.pitch=Math.max(-.065,Math.min(.065,C.pitch-(e.clientY-ly)*.0012));lx=e.clientX;ly=e.clientY};
look.onpointerup=look.onpointercancel=()=>drag=false;

function update(t){const dt=Math.min(.035,(t-last)/1000);last=t;const speed=4.2,f=-jy*speed*dt,s=jx*speed*dt;C.x+=Math.sin(C.yaw)*f+Math.cos(C.yaw)*s;C.z+=Math.cos(C.yaw)*f-Math.sin(C.yaw)*s;C.x=Math.max(-5.28,Math.min(5.28,C.x));C.z=Math.max(-20,Math.min(160,C.z));requestAnimationFrame(update)}requestAnimationFrame(update);
</script></body></html>
