<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fcdf0;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#look{position:fixed;right:0;top:0;width:68%;height:100%;z-index:5}
#joy{position:fixed;left:18px;bottom:20px;width:126px;height:126px;border:2px solid #fff8;border-radius:50%;background:#ffffff28;z-index:10}
#stick{position:absolute;left:35px;top:35px;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 3px 12px #0006}
#hud{position:fixed;top:12px;left:12px;z-index:10;background:#0009;color:#fff;padding:8px 11px;border-radius:9px;font:700 13px Arial}
#status{position:fixed;top:48px;left:12px;z-index:10;background:#0007;color:#fff;padding:5px 8px;border-radius:7px;font:11px Arial}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="look"></div><div id="joy"><div id="stick"></div></div><div id="hud">RUA 3D • PRIMEIRA PESSOA</div><div id="status">Carregando mundo...</div>
<script>
(function(){
const cdn=[
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
'https://unpkg.com/three@0.160.0/build/three.min.js'
];
function load(i){const s=document.createElement('script');s.src=cdn[i];s.onload=init;s.onerror=()=>i+1<cdn.length?load(i+1):fail();document.head.appendChild(s)}
function fail(){document.getElementById('status').textContent='Motor 3D não carregou';}
load(0);

function init(){
const T=THREE,canvas=document.getElementById('game'),status=document.getElementById('status');
const scene=new T.Scene();scene.background=new T.Color(0x8fcdf0);scene.fog=new T.Fog(0x8fcdf0,55,150);
const camera=new T.PerspectiveCamera(72,innerWidth/innerHeight,.05,180);
camera.position.set(0,1.65,10);camera.rotation.order='YXZ';
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true});}catch(e){status.textContent='WebGL indisponível neste aparelho';return}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.4));renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=T.SRGBColorSpace;
scene.add(new T.HemisphereLight(0xffffff,0x687451,1.8));
const sun=new T.DirectionalLight(0xffffff,1.4);sun.position.set(-25,35,20);scene.add(sun);

function M(c){return new T.MeshLambertMaterial({color:c})}
function cube(w,h,d,c){return new T.Mesh(new T.BoxGeometry(w,h,d),M(c))}
function makeHouse(x,z,body,roof){
 const g=new T.Group();
 const main=cube(6,3.5,5.8,body);main.position.y=1.75;g.add(main);
 const roofMesh=new T.Mesh(new T.ConeGeometry(4.35,1.7,4),M(roof));roofMesh.rotation.y=Math.PI/4;roofMesh.position.y=4.35;g.add(roofMesh);
 const front=cube(4.9,2.7,.12,body);front.position.set(0,1.55,2.94);g.add(front);
 const door=cube(1,1.9,.16,0x493c35);door.position.set(0,.95,3.03);g.add(door);
 [-1.9,1.9].forEach(q=>{const w=cube(1.25,1.05,.16,0xb9dbe5);w.position.set(q,2.05,3.03);g.add(w)});
 const sideWin=cube(.16,1.05,1.25,0xb9dbe5);sideWin.position.set(3.03,2.05,-.7);g.add(sideWin);
 const step=cube(2,.22,.8,0xbab1a7);step.position.set(0,.11,3.35);g.add(step);
 g.position.set(x,0,z);scene.add(g);
}
function makeTree(x,z){
 const g=new T.Group();
 const trunk=new T.Mesh(new T.CylinderGeometry(.2,.27,2.7,10),M(0x68452d));trunk.position.y=1.35;g.add(trunk);
 const a=new T.Mesh(new T.SphereGeometry(1.5,12,10),M(0x4f8146));a.position.y=3.1;g.add(a);
 const b=new T.Mesh(new T.SphereGeometry(1.05,12,10),M(0x5c8d4c));b.position.set(.8,3.35,.15);g.add(b);
 g.position.set(x,0,z);scene.add(g);
}
function makePole(x,z){
 const p=cube(.18,7,.18,0x777777);p.position.set(x,3.5,z);scene.add(p);
 const arm=cube(1.2,.12,.14,0x3e3e3e);arm.position.set(x,6.8,z);scene.add(arm);
 const lamp=new T.Mesh(new T.SphereGeometry(.18,8,6),M(0xf4e4a5));lamp.position.set(x,6.65,z);scene.add(lamp);
}
cube(14,.18,140,0x555555).position.set(0,-.09,48);
cube(2.4,.22,140,0xc3bdb3).position.set(-8.2,.02,48);
cube(2.4,.22,140,0xc3bdb3).position.set(8.2,.02,48);
cube(3.2,.15,140,0x789866).position.set(-11,.01,48);
cube(3.2,.15,140,0x789866).position.set(11,.01,48);
for(let z=0;z<130;z+=9)cube(.16,.025,4,0xe7d27b).position.set(0,.02,z);

const data=[
[-8,2,0xd7bd98,0x754a3d],[8,2,0xe7dfd4,0x985044],
[-8,17,0xc77d6c,0x69483c],[8,17,0x6e91a4,0x565656],
[-8,34,0xd2b58a,0x76503d],[8,34,0xdcd4c8,0x855348],
[-8,53,0xb96e60,0x69473c],[8,53,0xd5cec2,0x704d45],
[-8,74,0xc7aa7f,0x704a3b],[8,74,0xe2ddd4,0x875346]];
data.forEach(a=>makeHouse(a[0],a[1],a[2],a[3]));
[[-6,9],[6,25],[-6,43],[6,61],[-6,82],[6,99]].forEach(a=>makeTree(a[0],a[1]));
[[-6.8,4],[6.8,23],[-6.8,47],[6.8,69],[-6.8,91]].forEach(a=>makePole(a[0],a[1]));

let yaw=0,pitch=0,jx=0,jy=0,joyId=null,lookId=null,lastX=0,lastY=0;
const joy=document.getElementById('joy'),stick=document.getElementById('stick'),look=document.getElementById('look');
function jm(e){const r=joy.getBoundingClientRect();let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=36,n=Math.hypot(dx,dy);if(n>m){dx=dx/n*m;dy=dy/n*m}jx=dx/m;jy=dy/m;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);jm(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)jm(e)});
function je(e){if(e.pointerId===joyId){joyId=null;jx=jy=0;stick.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
look.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(e.pointerId)});
look.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;yaw-=(e.clientX-lastX)*.0045;pitch-=(e.clientY-lastY)*.0035;pitch=Math.max(-1.2,Math.min(1.2,pitch));lastX=e.clientX;lastY=e.clientY});
look.addEventListener('pointerup',()=>lookId=null);look.addEventListener('pointercancel',()=>lookId=null);

const keys={};addEventListener('keydown',e=>keys[e.code]=1);addEventListener('keyup',e=>keys[e.code]=0);
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 let f=(keys.KeyW||keys.ArrowUp?1:0)-((keys.KeyS||keys.ArrowDown)?1:0)-jy;
 let s=(keys.KeyD||keys.ArrowRight?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0)+jx;
 const n=Math.hypot(f,s);if(n>1){f/=n;s/=n}
 const speed=5*dt;
 camera.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*s)*speed;
 camera.position.z+=(-Math.cos(yaw)*f+Math.sin(yaw)*s)*speed;
 camera.position.x=Math.max(-6.1,Math.min(6.1,camera.position.x));
 camera.position.z=Math.max(-1,Math.min(112,camera.position.z));
 camera.position.y=1.65;
 camera.rotation.y=yaw;camera.rotation.x=pitch;
 renderer.render(scene,camera);requestAnimationFrame(loop);
}
status.textContent='Mundo 3D carregado';requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});
}
})();
</script>
</body></html>
