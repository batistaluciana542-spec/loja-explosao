<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D • Three.js</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fc9df;touch-action:none;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;z-index:20;left:10px;top:10px;padding:8px 10px;border-radius:8px;background:#111c;color:#fff;font-size:12px;font-weight:bold}
#joy{position:fixed;z-index:30;left:18px;bottom:18px;width:132px;height:132px;border:2px solid #fff9;border-radius:50%;background:#1114}
#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 3px 12px #0007}
#look{position:fixed;z-index:25;right:0;top:0;width:70%;height:100%}
#loading{position:fixed;z-index:40;inset:0;display:flex;align-items:center;justify-content:center;background:#18232b;color:white;font-size:18px;font-weight:bold}
#err{display:none;position:fixed;z-index:50;inset:0;padding:25px;background:#20252b;color:white;white-space:pre-wrap;font:14px monospace}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">CARREGANDO MOTOR 3D...<br><small style="opacity:.7">tentando carregar Three.js de vários servidores</small></div>
<div id="hud">RUA 3D • THREE.JS</div>
<div id="look"></div>
<div id="joy"><div id="knob"></div></div>
<div id="err"></div>
<script>
(function(){
'use strict';
const loading=document.getElementById('loading'),err=document.getElementById('err');
function fail(e){loading.style.display='none';err.style.display='block';err.textContent='ERRO DO MOTOR 3D:\n'+(e&&e.stack||e)}
function loadThree(urls,i){
  if(window.THREE){start();return}
  if(i>=urls.length){fail('Three.js não pôde ser baixado.\nA versão atual precisa de um arquivo local do Three.js para funcionar sem CDN.');return}
  const s=document.createElement('script');
  s.src=urls[i];
  s.async=false;
  s.onload=()=>{ if(window.THREE) start(); else loadThree(urls,i+1); };
  s.onerror=()=>loadThree(urls,i+1);
  document.head.appendChild(s);
  setTimeout(()=>{if(!window.THREE) {try{s.remove()}catch(e){} loadThree(urls,i+1)}},7000);
}
function start(){
try{
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc9df);
scene.fog=new THREE.Fog(0x9fc9df,35,100);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,150);
camera.position.set(0,1.7,0);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xffffff,0x63704d,2));
const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(-20,35,10);scene.add(sun);

function mat(color){return new THREE.MeshStandardMaterial({color,roughness:.85,metalness:0})}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,180),mat(0x78945f));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.04,55);scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(7,180),mat(0x555555));road.rotation.x=-Math.PI/2;road.position.z=55;scene.add(road);
for(const x of [-5,5]){const s=new THREE.Mesh(new THREE.PlaneGeometry(3,140),mat(0xc9c1b7));s.rotation.x=-Math.PI/2;s.position.set(x,0,55);scene.add(s)}
const grass=new THREE.Mesh(new THREE.PlaneGeometry(50,140),mat(0x6f9658));grass.rotation.x=-Math.PI/2;grass.position.set(0,-.03,55);scene.add(grass);
for(let z=-10;z<150;z+=8){const line=new THREE.Mesh(new THREE.BoxGeometry(.18,.015,3.2),mat(0xe4d47b));line.position.set(0,.01,z);scene.add(line)}

const houses=[
[-7.4,9,4.6,5.8,3.2,0xd8b28c,0x70483c],[-7.5,19,5.0,6.0,3.1,0xcf8775,0x69463c],[-7.4,29,4.7,6.2,3.5,0xded9d0,0x754e45],
[7.4,9,4.6,5.8,3.2,0xded2b9,0x714c40],[7.5,19,5.0,6.0,3.0,0xcda07e,0x69483d],[7.4,29,4.7,6.2,3.4,0xe0d9ce,0x805247]
];
function cube(x,y,z,w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y+h/2,z);scene.add(m);return m}
function makeHouse(h){
const[x,z,w,d,hh,col,roof]=h;
cube(x,0,z,w,hh,d,col);
cube(x,.05,z-d/2-.08,.95,1.65,.12,0x49342c);
for(const dx of[-w*.27,w*.27])cube(x+dx,1.7,z-d/2-.08,.9,.72,.08,0xa9d4dc);
const roofGeo=new THREE.ConeGeometry(Math.max(w*.72,d*.65),1.05,4);
const rm=new THREE.Mesh(roofGeo,mat(roof));rm.position.set(x,hh+.52,z);rm.rotation.y=Math.PI/4;scene.add(rm);
}
houses.forEach(makeHouse);

function tree(x,z,s){cube(x,0,z,.38,2.2*s,.38,0x68462f);const m=mat(0x3e7b45);for(const p of[[0,2.7,0],[-.55,2.55,0],[.55,2.55,0],[0,3.15,.1]]){const q=new THREE.Mesh(new THREE.SphereGeometry(.75*s,10,8),m);q.position.set(x+p[0],p[1]*s,z+p[2]);scene.add(q)}}
[[ -4,7,1],[4,13,.9],[-4,23,1],[4,27,.85],[-9,16,.8],[9,23,.8]].forEach(t=>tree(...t));

function pole(x,z){cube(x,0,z,.13,5.2,.13,0x5b5b57);const arm=cube(x,4.9,z,.1,.1,3.2,0x30302e);arm.rotation.y=Math.PI/2}
[[-3,5],[3,14],[-3,24],[3,32]].forEach(p=>pole(...p));

const joy=document.getElementById('joy'),knob=document.getElementById('knob'),look=document.getElementById('look');
let jx=0,jy=0,looking=false,lx=0,ly=0,yaw=0,pitch=0;
function jm(e){const r=joy.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,n=Math.hypot(x,y),m=42;if(n>m){x=x*m/n;y=y*m/n}jx=x/m;jy=y/m;knob.style.transform='translate('+x+'px,'+y+'px)'}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);jm(e)};joy.onpointermove=jm;
function js(){jx=jy=0;knob.style.transform='translate(0,0)'}joy.onpointerup=joy.onpointercancel=joy.onlostpointercapture=js;
look.onpointerdown=e=>{looking=true;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)};
look.onpointermove=e=>{if(!looking)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.006;pitch=Math.max(-1.0,Math.min(1.0,pitch-dy*.004))};
look.onpointerup=look.onpointercancel=()=>looking=false;

let last=performance.now();
function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;
camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
const speed=5*dt;const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
camera.position.addScaledVector(forward,-jy*speed);camera.position.addScaledVector(right,jx*speed);
camera.position.y=1.7;renderer.render(scene,camera);requestAnimationFrame(loop)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});
requestAnimationFrame(loop);
}catch(e){fail(e)}
loadThree([
'https://raw.githubusercontent.com/mrdoob/three.js/r181/build/three.min.js',
'https://threejs.org/build/three.min.js',
'https://unpkg.com/three@0.181.1/build/three.min.js',
'https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.min.js',
'https://cdnjs.cloudflare.com/ajax/libs/three.js/r181/three.min.js'
],0);
})();
</script>
</body></html>
