<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Rua 3D • Three.js Local</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fc9df;touch-action:none;font-family:Arial,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:fixed;z-index:20;left:10px;top:10px;padding:8px 10px;border-radius:8px;background:#111c;color:#fff;font-size:12px;font-weight:bold}#joy{position:fixed;z-index:30;left:18px;bottom:18px;width:132px;height:132px;border:2px solid #fff9;border-radius:50%;background:#1114}#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 3px 12px #0007}#look{position:fixed;z-index:25;right:0;top:0;width:70%;height:100%}
</style></head><body><canvas id="game"></canvas><div id="hud">RUA 3D • THREE.JS LOCAL</div><div id="look"></div><div id="joy"><div id="knob"></div></div>
<script src="./three.min.js"></script><script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('hud').textContent='ERRO: three.min.js não encontrado';return}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc9df);
scene.fog=new THREE.Fog(0x9fc9df,35,110);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,180);
camera.position.set(0,1.7,0);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight,false);

function mat(c){return new THREE.MeshLambertMaterial({color:c})}
function cube(x,y,z,w,h,d,c){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
 m.position.set(x,y+h/2,z);
 scene.add(m);
 return m;
}

scene.add(new THREE.HemisphereLight(0xffffff,0x526044,2));
const sun=new THREE.DirectionalLight(0xffffff,1.2);
sun.position.set(-20,30,10);
scene.add(sun);

// Mundo FIXO. A câmera é a única coisa que gira.
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,260),mat(0x70945d));
ground.rotation.x=-Math.PI/2;
ground.position.z=70;
scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(7,260),mat(0x505050));
road.rotation.x=-Math.PI/2;
road.position.set(0,0,70);
scene.add(road);

for(const x of[-5,5]){
 const s=new THREE.Mesh(new THREE.PlaneGeometry(3,260),mat(0xc5beb5));
 s.rotation.x=-Math.PI/2;
 s.position.set(x,0,70);
 scene.add(s);
}

for(let z=-25;z<210;z+=9) cube(0,.01,z,.16,.025,3,0xe5d67d);

// Casas fora da faixa da rua, com profundidade real.
const houses=[
 [-8.8,8,5.0,6.2,3.0,0xd9b28c,0x754b3e],
 [-8.7,20,5.2,6.5,3.0,0xc98778,0x68443a],
 [-8.6,33,4.9,6.2,3.2,0xd8d3c9,0x765047],
 [8.8,10,5.0,6.2,3.0,0xd8cdb7,0x6f493e],
 [8.7,22,5.2,6.5,3.0,0xcda07e,0x69473b],
 [8.6,35,4.9,6.2,3.2,0xe0d8cd,0x805246]
];

for(const h of houses){
 const [x,z,w,d,hh,c,rc]=h;
 cube(x,0,z,w,hh,d,c);

 // Porta na face voltada para a rua
 cube(x,0.02,z-d/2-.07,.9,1.7,.14,0x49332b);

 // Janelas
 for(const dx of[-w*.27,w*.27])
   cube(x+dx,1.55,z-d/2-.075,.82,.72,.10,0xa9d5df);

 // Telhado realmente 3D
 const roof=new THREE.Mesh(
   new THREE.ConeGeometry(Math.max(w*.72,d*.62),1.15,4),
   mat(rc)
 );
 roof.position.set(x,hh+.575,z);
 roof.rotation.y=Math.PI/4;
 scene.add(roof);
}

function tree(x,z,s=1){
 cube(x,0,z,.35,2.2*s,.35,0x65442d);
 for(const p of[[0,2.5,0],[-.55,2.35,0],[.55,2.35,0],[0,3,.1]]){
  const q=new THREE.Mesh(new THREE.SphereGeometry(.7*s,10,8),mat(0x397447));
  q.position.set(x+p[0]*s,p[1]*s,z+p[2]);
  scene.add(q);
 }
}
[[-4,7,1],[4,14,.9],[-4,25,1],[4,30,.85],[-9,16,.8],[9,26,.8]].forEach(t=>tree(...t));

function pole(x,z){
 cube(x,0,z,.13,5.2,.13,0x5a5a56);
 cube(x,4.9,z,.1,.1,3.2,0x30302e);
}
[[-3,5],[3,15],[-3,27],[3,38]].forEach(p=>pole(...p));

const joy=document.getElementById('joy'),knob=document.getElementById('knob'),look=document.getElementById('look');
let jx=0,jy=0,looking=false,lx=0,ly=0,yaw=0,pitch=0;

function jm(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const n=Math.hypot(x,y),m=42;
 if(n>m){x=x*m/n;y=y*m/n}
 jx=x/m;jy=y/m;
 knob.style.transform='translate('+x+'px,'+y+'px)';
}

joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);jm(e)};
joy.onpointermove=jm;
joy.onpointerup=joy.onpointercancel=joy.onlostpointercapture=()=>{
 jx=jy=0;knob.style.transform='translate(0,0)'
};

look.onpointerdown=e=>{looking=true;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)};
look.onpointermove=e=>{
 if(!looking)return;
 const dx=e.clientX-lx,dy=e.clientY-ly;
 lx=e.clientX;ly=e.clientY;
 yaw-=dx*.006;
 pitch=Math.max(-.75,Math.min(.75,pitch-dy*.004));
};
look.onpointerup=look.onpointercancel=()=>looking=false;

// Movimento calculado pela direção da câmera, sem mover/rotacionar a rua.
const moveForward=new THREE.Vector3();
const moveRight=new THREE.Vector3();
const upAxis=new THREE.Vector3(0,1,0);

let last=performance.now();
function loop(t){
 const dt=Math.min(.04,(t-last)/1000);
 last=t;

 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 moveForward.set(Math.sin(yaw),0,Math.cos(yaw));
 moveRight.set(Math.cos(yaw),0,-Math.sin(yaw));

 const speed=4.2*dt;
 camera.position.addScaledVector(moveForward,jy*speed);
 camera.position.addScaledVector(moveRight,jx*speed);

 // Altura constante: o jogador nunca afunda nem voa.
 camera.position.y=1.7;

 // Limites simples para não sair do cenário.
 camera.position.x=Math.max(-3.0,Math.min(3.0,camera.position.x));
 camera.position.z=Math.max(-20,Math.min(205,camera.position.z));

 renderer.render(scene,camera);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight,false);
});
})();
</script></body></html>
