<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc9e8;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#look{position:fixed;right:0;top:0;width:72%;height:100%;z-index:4}
#joy{position:fixed;left:18px;bottom:18px;width:138px;height:138px;border:2px solid #fff8;border-radius:50%;background:#0004;z-index:10}
#knob{position:absolute;left:43px;top:43px;width:48px;height:48px;border-radius:50%;background:white}
</style></head><body>
<canvas id="game"></canvas><div id="look"></div><div id="joy"><div id="knob"></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,D=1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();

const P={x:0,z:0,a:0,p:0};
let jx=0,jy=0,lookDrag=false,lx=0,ly=0,last=performance.now();

/* Mundo simples e estável. Casas são blocos fechados, não fachadas soltas. */
const houses=[
 {x:-7,z:8,w:4.8,d:6,h:3.2,c:'#d6ad87',r:'#875440'},
 {x:-7,z:20,w:5,d:6.5,h:3.3,c:'#cc877a',r:'#70463d'},
 {x:-7,z:33,w:4.8,d:6,h:3.4,c:'#d8d2c8',r:'#70564b'},
 {x:-7,z:46,w:5,d:6.3,h:3.2,c:'#c8b09b',r:'#725247'},
 {x:7,z:10,w:4.8,d:6,h:3.2,c:'#d7cbb1',r:'#765043'},
 {x:7,z:23,w:5,d:6.5,h:3.3,c:'#cda17e',r:'#6d493d'},
 {x:7,z:36,w:4.8,d:6,h:3.4,c:'#ddd7ce',r:'#785247'},
 {x:7,z:49,w:5,d:6.3,h:3.2,c:'#d1b18e',r:'#705045'}
];
const trees=[[-4.5,7],[-4.5,18],[-4.5,30],[-4.5,43],[4.5,14],[4.5,27],[4.5,40],[4.5,53]];
const poles=[[-3.7,5],[-3.7,19],[-3.7,34],[-3.7,49],[3.7,12],[3.7,28],[3.7,44]];

function shade(hex,n){let v=parseInt(hex.slice(1),16);let r=Math.max(0,Math.min(255,(v>>16)+n)),g=Math.max(0,Math.min(255,((v>>8)&255)+n)),b=Math.max(0,Math.min(255,(v&255)+n));return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}

function project(x,z,h=0){
 let dx=x-P.x,dz=z-P.z,co=Math.cos(P.a),si=Math.sin(P.a);
 let forward=dx*si+dz*co;
 let side=dx*co-dz*si;
 if(forward<=.25)return null;
 const f=Math.min(W,H)*.9;
 return {x:W/2+side*f/forward,y:H*.54-(h-P.p)*f/forward,s:f/forward,d:forward};
}

/* O piso é uma única superfície contínua. Não há recorte de horizonte baseado no joystick. */
function floor(){
 ctx.fillStyle='#8fc9e8';ctx.fillRect(0,0,W,H);
 const horizon=H*.54-P.p*H*1.15;
 ctx.fillStyle='#72945d';ctx.fillRect(0,Math.max(0,Math.min(H,horizon)),W,H);
 // rua como faixas em perspectiva, sempre visíveis abaixo do horizonte
 const near=Math.max(-180,P.z-120),far=P.z+180;
 const a=project(-3.6,near),b=project(3.6,near),d=project(-3.6,far),e=project(3.6,far);
 if(a&&b&&d&&e){
  ctx.fillStyle='#505050';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(e.x,e.y);ctx.lineTo(d.x,d.y);ctx.fill();
 }
 for(const [l,r,col] of [[-5.2,-3.6,'#b9b3a8'],[3.6,5.2,'#b9b3a8']]){
  const q1=project(l,near),q2=project(r,near),q3=project(r,far),q4=project(l,far);
  if(q1&&q2&&q3&&q4){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(q1.x,q1.y);ctx.lineTo(q2.x,q2.y);ctx.lineTo(q3.x,q3.y);ctx.lineTo(q4.x,q4.y);ctx.fill()}
 }
 for(let z=P.z+4;z<P.z+170;z+=9){
  const q1=project(-.07,z),q2=project(.07,z),q3=project(.07,z+3),q4=project(-.07,z+3);
  if(q1&&q2&&q3&&q4){ctx.fillStyle='#e0d36f';ctx.beginPath();ctx.moveTo(q1.x,q1.y);ctx.lineTo(q2.x,q2.y);ctx.lineTo(q3.x,q3.y);ctx.lineTo(q4.x,q4.y);ctx.fill()}
 }
}

/* Casa desenhada como volume fechado: primeiro corpo, depois telhado, sempre sólida. */
function drawHouse(h){
 const front=project(h.x,h.z-h.d/2,h.h),base=project(h.x,h.z-h.d/2,0);
 const back=project(h.x,h.z+h.d/2,h.h);
 if(!front||!base||!back)return;
 const left=project(h.x-h.w/2,h.z-h.d/2,h.h),right=project(h.x+h.w/2,h.z-h.d/2,h.h);
 if(!left||!right)return;
 const bl=project(h.x-h.w/2,h.z-h.d/2,0),br=project(h.x+h.w/2,h.z-h.d/2,0);
 if(!bl||!br)return;

 // fachada
 ctx.fillStyle=h.c;
 ctx.beginPath();ctx.moveTo(bl.x,bl.y);ctx.lineTo(br.x,br.y);ctx.lineTo(right.x,right.y);ctx.lineTo(left.x,left.y);ctx.fill();
 // lateral esquerda/direita em tom escuro
 const sl=project(h.x-h.w/2,h.z+h.d/2,0),slh=project(h.x-h.w/2,h.z+h.d/2,h.h);
 const sr=project(h.x+h.w/2,h.z+h.d/2,0),srh=project(h.x+h.w/2,h.z+h.d/2,h.h);
 if(sl&&slh){ctx.fillStyle=shade(h.c,-20);ctx.beginPath();ctx.moveTo(bl.x,bl.y);ctx.lineTo(left.x,left.y);ctx.lineTo(slh.x,slh.y);ctx.lineTo(sl.x,sl.y);ctx.fill()}
 if(sr&&srh){ctx.fillStyle=shade(h.c,-30);ctx.beginPath();ctx.moveTo(br.x,br.y);ctx.lineTo(right.x,right.y);ctx.lineTo(srh.x,srh.y);ctx.lineTo(sr.x,sr.y);ctx.fill()}
 // teto sólido
 const pf=project(h.x,h.z-h.d/2,h.h+1.05),pb=project(h.x,h.z+h.d/2,h.h+1.05);
 if(pf&&pb&&slh&&srh){
  ctx.fillStyle=h.r;ctx.beginPath();ctx.moveTo(left.x,left.y);ctx.lineTo(right.x,right.y);ctx.lineTo(pf.x,pf.y);ctx.fill();
  ctx.fillStyle=shade(h.r,-18);ctx.beginPath();ctx.moveTo(slh.x,slh.y);ctx.lineTo(srh.x,srh.y);ctx.lineTo(pb.x,pb.y);ctx.lineTo(pf.x,pf.y);ctx.fill();
 }
 // porta e janelas na frente, nunca buracos
 const door=project(h.x,h.z-h.d/2-.01,1.05);
 if(door){ctx.fillStyle='#4a3027';ctx.fillRect(door.x-door.s*.055,door.y-door.s*.18,door.s*.11,door.s*.36)}
 for(const off of [-h.w*.28,h.w*.28]){
  const q=project(h.x+off,h.z-h.d/2-.015,2.05);
  if(q){ctx.fillStyle='#a8d0d8';ctx.fillRect(q.x-q.s*.065,q.y-q.s*.055,q.s*.13,q.s*.11);ctx.strokeStyle='#444';ctx.strokeRect(q.x-q.s*.065,q.y-q.s*.055,q.s*.13,q.s*.11)}
 }
}

/* árvores simples, com tronco e copa bem definida */
function drawTree(x,z){
 const b=project(x,z,0),t=project(x,z,3.2);
 if(!b||!t)return;
 ctx.strokeStyle='#60452f';ctx.lineWidth=Math.max(2,b.s*.045);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(t.x,t.y);ctx.stroke();
 for(const [ox,oy,rr] of [[0,2.8,.5],[-.38,2.45,.38],[.38,2.45,.38],[0,2.2,.38]]){
  const q=project(x+ox,z,oy);if(!q)continue;let R=Math.max(7,q.s*rr);
  ctx.fillStyle='#2f663b';ctx.beginPath();ctx.arc(q.x,q.y,R,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4b8248';ctx.beginPath();ctx.arc(q.x-R*.2,q.y-R*.2,R*.55,0,Math.PI*2);ctx.fill();
 }
}
function drawPole(x,z){
 const a=project(x,z,0),b=project(x,z,5.3);if(!a||!b)return;
 ctx.strokeStyle='#555';ctx.lineWidth=Math.max(2,a.s*.025);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}

function render(){
 floor();
 const objects=[];
 houses.forEach(h=>{let q=project(h.x,h.z,0);if(q)objects.push([q.d,()=>drawHouse(h)])});
 trees.forEach(t=>{let q=project(t[0],t[1],0);if(q)objects.push([q.d,()=>drawTree(t[0],t[1])])});
 poles.forEach(t=>{let q=project(t[0],t[1],0);if(q)objects.push([q.d,()=>drawPole(t[0],t[1])])});
 objects.sort((a,b)=>b[0]-a[0]);objects.forEach(o=>o[1]());
 requestAnimationFrame(render);
}
render();

const joy=document.getElementById('joy'),knob=document.getElementById('knob');
function setJoy(e){const r=joy.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=43,n=Math.hypot(x,y);if(n>m){x=x/n*m;y=y/n*m}jx=x/m;jy=y/m;knob.style.transform='translate('+x+'px,'+y+'px)'}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);setJoy(e)};joy.onpointermove=e=>{if(joy.hasPointerCapture(e.pointerId))setJoy(e)};
function stop(){jx=jy=0;knob.style.transform='translate(0,0)'}joy.onpointerup=joy.onpointercancel=stop;

const look=document.getElementById('look');
look.onpointerdown=e=>{look.setPointerCapture(e.pointerId);lookDrag=true;lx=e.clientX;ly=e.clientY};
look.onpointermove=e=>{if(!lookDrag)return;P.a-=(e.clientX-lx)*.004;P.p=Math.max(-.16,Math.min(.16,P.p-(e.clientY-ly)*.0025));lx=e.clientX;ly=e.clientY};
look.onpointerup=look.onpointercancel=()=>lookDrag=false;

function update(t){
 const dt=Math.min(.035,(t-last)/1000);last=t;
 const speed=4.0, f=-jy*speed*dt,s=jx*speed*dt;
 P.x+=Math.sin(P.a)*f+Math.cos(P.a)*s;
 P.z+=Math.cos(P.a)*f-Math.sin(P.a)*s;
 P.x=Math.max(-2.4,Math.min(2.4,P.x));
 P.z=Math.max(-30,Math.min(150,P.z));
 requestAnimationFrame(update);
}
requestAnimationFrame(update);
</script></body></html>
