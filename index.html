<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rua Explorer</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fcdf0;font-family:Arial,sans-serif;touch-action:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:12px;left:12px;background:#0009;color:white;padding:8px 11px;border-radius:10px;font-size:13px;font-weight:700}
#look{position:fixed;right:0;top:0;width:62%;height:100%}
#joy{position:fixed;left:18px;bottom:20px;width:124px;height:124px;border-radius:50%;background:#ffffff30;border:2px solid #fff8}
#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0005}
</style></head><body>
<svg id="scene" viewBox="0 0 1000 700" preserveAspectRatio="none">
<rect width="1000" height="365" fill="#8fcdf0"/><rect y="365" width="1000" height="335" fill="#7f9e68"/>
<path d="M370 365 L630 365 L930 700 L70 700 Z" fill="#555"/>
<path d="M0 365 L370 365 L70 700 L0 700Z" fill="#c3beb5"/><path d="M630 365 L1000 365 L1000 700 L930 700Z" fill="#c3beb5"/>
<g id="world">
<g transform="translate(180 250)"><rect width="145" height="115" fill="#d6bd99"/><rect x="18" y="58" width="35" height="57" fill="#493c35"/><rect x="80" y="48" width="35" height="30" fill="#eee"/><polygon points="0,0 145,0 130,-22 15,-22" fill="#754f3e"/></g>
<g transform="translate(675 260)"><rect width="145" height="105" fill="#eee5d9"/><rect x="25" y="50" width="35" height="55" fill="#4b4039"/><rect x="88" y="45" width="30" height="28" fill="#9bc7d9"/><polygon points="0,0 145,0 130,-20 15,-20" fill="#9d5548"/></g>
<g transform="translate(95 325) scale(.72)"><rect width="145" height="115" fill="#c97d6c"/><rect x="20" y="57" width="35" height="58" fill="#333"/><rect x="82" y="45" width="32" height="30" fill="#eee"/><polygon points="0,0 145,0 130,-22 15,-22" fill="#71493e"/></g>
<g transform="translate(760 330) scale(.72)"><rect width="145" height="115" fill="#668ba0"/><rect x="20" y="57" width="35" height="58" fill="#333"/><rect x="82" y="45" width="32" height="30" fill="#eee"/><polygon points="0,0 145,0 130,-22 15,-22" fill="#555"/></g>
<g fill="#684a35"><rect x="155" y="315" width="8" height="55"/><rect x="840" y="315" width="8" height="55"/></g>
<g fill="#4d7d46"><circle cx="159" cy="306" r="34"/><circle cx="844" cy="306" r="34"/></g>
<g fill="#777"><rect x="300" y="300" width="7" height="90"/><rect x="700" y="300" width="7" height="90"/></g>
<g fill="#333"><rect x="283" y="300" width="41" height="5"/><rect x="683" y="300" width="41" height="5"/></g>
</g></svg>
<div id="hud">RUA EXPLORER</div><div id="look"></div><div id="joy"><div id="stick"></div></div>
<script>
(function(){
var world=document.getElementById('world'),look=document.getElementById('look'),joy=document.getElementById('joy'),stick=document.getElementById('stick');
var ox=0,oy=0,rot=0,lookId=null,joyId=null,lx=0,jx=0,jy=0;
function apply(){world.setAttribute('transform','translate('+ox+' '+oy+') rotate('+rot+' 500 365)')}
look.addEventListener('pointerdown',function(e){lookId=e.pointerId;lx=e.clientX;look.setPointerCapture(e.pointerId)});
look.addEventListener('pointermove',function(e){if(e.pointerId===lookId){rot+=(e.clientX-lx)*.08;lx=e.clientX;apply()}});
look.addEventListener('pointerup',function(){lookId=null});look.addEventListener('pointercancel',function(){lookId=null});
function joyMove(e){var r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=34,n=Math.hypot(dx,dy);if(n>m){dx=dx/n*m;dy=dy/n*m}jx=dx/m;jy=dy/m;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.addEventListener('pointerdown',function(e){joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',function(e){if(e.pointerId===joyId)joyMove(e)});
function end(e){if(e.pointerId===joyId){joyId=null;jx=jy=0;stick.style.transform='translate(0,0)'}}
joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
function loop(){ox+=jx*.8;oy-=jy*.8;if(ox>80)ox=80;if(ox<-80)ox=-80;if(oy>70)oy=70;if(oy<-70)oy=-70;apply();requestAnimationFrame(loop)}loop();
})();
</script></body></html>
