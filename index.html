<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D • Nova</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9d8e7;touch-action:none;font-family:Arial}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;z-index:5;left:10px;top:10px;color:#fff;background:#111b;padding:8px 10px;border-radius:8px;font-weight:bold;font-size:12px}
#joy{position:fixed;z-index:10;left:18px;bottom:18px;width:128px;height:128px;border:2px solid #ffffff99;border-radius:50%;background:#1113}
#knob{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 3px 12px #0006}
#look{position:fixed;right:0;top:0;width:70%;height:100%;z-index:8}
</style></head><body>
<canvas id="c"></canvas><div id="hud">RUA 3D • NOVA</div>
<div id="look"></div><div id="joy"><div id="knob"></div></div>
<script>
'use strict';
const c=document.getElementById('c'),g=c.getContext('2d'),joy=document.getElementById('joy'),knob=document.getElementById('knob'),look=document.getElementById('look');
let W,H,dpr,cam={x:0,y:1.7,z:0,a:0,p:0},jx=0,jy=0,drag=false,lx=0,ly=0;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();

const houses=[
[-7,10,5,6,3.2,'#d8b28c','#70483c'],[-7,19,5.5,6,3.1,'#cf8775','#69463c'],[-7,28,5,6,3.5,'#ded9d0','#754e45'],
[7,9,5,6,3.2,'#ded2b9','#714c40'],[7,18,5.5,6,3,'#cda07e','#69483d'],[7,28,5,6,3.4,'#e0d9ce','#805247']
];
const trees=[[-4,7,1], [4,12,.9],[-4,21,1],[4,26,.85],[-9,16,.8],[9,23,.8]];
const poles=[[-3,5], [3,14],[-3,24],[3,32]];

function tr(x,y,z){let X=x-cam.x,Y=y-cam.y,Z=z-cam.z,ca=Math.cos(cam.a),sa=Math.sin(cam.a);let xx=X*ca-Z*sa,zz=X*sa+Z*ca,cp=Math.cos(cam.p),sp=Math.sin(cam.p);return [xx,Y*cp-zz*sp,Y*sp+zz*cp]}
function P(v){if(v[2]<.12)return null;let f=Math.min(W,H)*.95;return [W/2+v[0]*f/v[2],H/2-v[1]*f/v[2],v[2]]}
function face(v,col){let p=v.map(x=>P(tr(x[0],x[1],x[2])));if(p.some(x=>!x))return;p.sort((a,b)=>a[2]-b[2]);g.beginPath();let q=p[0];g.moveTo(q[0],q[1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();g.fillStyle=col;g.fill()}
function cube(x,y,z,w,h,d,col){
let a=x-w/2,b=x+w/2,s=z-d/2,t=z+d/2;
let F=[[[a,y,s],[b,y,s],[b,y+h,s],[a,y+h,s]],[[b,y,s],[b,y,t],[b,y+h,t],[b,y+h,s]],[[b,y,t],[a,y,t],[a,y+h,t],[b,y+h,t]],[[a,y,t],[a,y,s],[a,y+h,s],[a,y+h,t]],[[a,y+h,s],[b,y+h,s],[b,y+h,t],[a,y+h,t]]];
F.sort((u,v)=>tr(u[0][0],u[0][1],u[0][2])[2]-tr(v[0][0],v[0][1],v[0][2])[2]);F.forEach(f=>face(f,col))
}
function house(h){
let [x,z,w,d,hh,col,roof]=h;cube(x,0,z,w,hh,d,col);
let f=z-d/2-.03;cube(x,.05,f,.9,1.65,.08,'#4a332b');
cube(x-w*.27,1.65,f,.85,.7,.06,'#a9d4dc');cube(x+w*.27,1.65,f,.85,.7,.06,'#a9d4dc');
face([[x-w*.58,hh,z-d*.58],[x,hh+.9,z-d*.58],[x+w*.58,hh,z-d*.58]],roof);
}
function tree(t){let[x,z,s]=t;cube(x,.1,z,.3,2*s,.3,'#65432d');let p=P(tr(x,2.8*s,z));if(!p)return;let r=Math.max(5,70*s/p[2]);g.fillStyle='#3e7b45';g.beginPath();g.arc(p[0],p[1],r,0,7);g.fill();g.fillStyle='#4d8d4f';g.beginPath();g.arc(p[0]-r*.35,p[1]-r*.1,r*.65,0,7);g.fill()}
function pole(q){let[x,z]=q;cube(x,0,z,.12,5,.12,'#5b5b57');let a=P(tr(x,5,z)),b=P(tr(x,5,z+7));if(a&&b){g.strokeStyle='#30302f';g.lineWidth=2;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}}
function ground(){face([[-30,0,-30],[30,0,-30],[30,0,80],[-30,0,80]],'#6f9658');face([[-3.2,.01,-30],[3.2,.01,-30],[3.2,.01,80],[-3.2,.01,80]],'#505050');face([[-5,.02,-30],[-3.2,.02,-30],[-3.2,.02,80],[-5,.02,80]],'#c9c1b7');face([[3.2,.02,-30],[5,.02,-30],[5,.02,80],[3.2,.02,80]],'#c9c1b7');for(let z=-20;z<80;z+=8)face([[-.11,.03,z],[.11,.03,z],[.11,.03,z+3],[-.11,.03,z+3]],'#e4d47b')}
function draw(){g.fillStyle='#9cc9df';g.fillRect(0,0,W,H);let sky=g.createLinearGradient(0,0,0,H*.65);sky.addColorStop(0,'#83bddd');sky.addColorStop(1,'#dce9ed');g.fillStyle=sky;g.fillRect(0,0,W,H*.65);ground();let a=[];houses.forEach(h=>a.push([h[1],()=>house(h)]));trees.forEach(t=>a.push([t[1],()=>tree(t)]));poles.forEach(p=>a.push([p[1],()=>pole(p)]));a.sort((u,v)=>tr(0,1,v[0])[2]-tr(0,1,u[0])[2]);a.forEach(x=>x[1]());requestAnimationFrame(draw)}
function move(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,n=Math.hypot(x,y),m=40;if(n>m){x*=m/n;y*=m/n}jx=x/m;jy=y/m;knob.style.transform='translate('+x+'px,'+y+'px)'}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);move(e)};joy.onpointermove=move;function stop(){jx=jy=0;knob.style.transform='translate(0,0)'}joy.onpointerup=stop;joy.onpointercancel=stop;joy.onlostpointercapture=stop;
look.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)};look.onpointermove=e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;cam.a-=dx*.006;cam.p=Math.max(-.7,Math.min(.7,cam.p-dy*.004))};look.onpointerup=look.onpointercancel=()=>drag=false;
let old=performance.now();function tick(t){let dt=Math.min(.04,(t-old)/1000);old=t;let speed=4.8*dt,ca=Math.cos(cam.a),sa=Math.sin(cam.a);cam.x+=(-jy*sa+jx*ca)*speed;cam.z+=(-jy*ca-jx*sa)*speed;requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
</script></body></html>
