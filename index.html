<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rua 3D</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fc9df;touch-action:none;font-family:Arial}canvas{position:fixed;inset:0;width:100%;height:100%}#joy{position:fixed;z-index:5;left:18px;bottom:18px;width:132px;height:132px;border:2px solid #fff8;border-radius:50%;background:#1114}#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:#fff}#look{position:fixed;right:0;top:0;width:70%;height:100%;z-index:4}</style></head><body><canvas id="game"></canvas><div id="look"></div><div id="joy"><div id="knob"></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let px=0,pz=0,yaw=0,pitch=0,jx=0,jy=0,drag=0,lx=0,ly=0;
const houses=[[-8.8,8,5,6,3,'#d9b28c','#754b3e'],[-8.7,20,5.2,6.5,3,'#c98778','#68443a'],[-8.6,33,4.9,6.2,3.2,'#d8d3c9','#765047'],[8.8,10,5,6,3,'#d8cdb7','#6f493e'],[8.7,22,5.2,6.5,3,'#cda07e','#69473b'],[8.6,35,4.9,6.2,3.2,'#e0d8cd','#805246']];
const trees=[[-4,7,1],[4,14,.9],[-4,25,1],[4,30,.85],[-9,16,.8],[9,26,.8]],poles=[[-3,5],[3,15],[-3,27],[3,38]];
function project(X,Y,Z){const dx=X-px,dz=Z-pz,co=Math.cos(yaw),si=Math.sin(yaw),rx=dx*co-dz*si,rz=dx*si+dz*co,cp=Math.cos(pitch),sp=Math.sin(pitch),ry=Y*cp-rz*sp,rz2=Y*sp+rz*cp;if(rz2<=.15)return null;const f=H*.78;return [W/2+rx*f/rz2,H*.53-ry*f/rz2,f/rz2]}
function poly(a,b,d,col){x.fillStyle=col;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(d[0],d[1]);x.closePath();x.fill()}
function box(o){let[X,Z,w,dep,h,col,roof]=o,vs=[[X-w/2,0,Z-dep/2],[X+w/2,0,Z-dep/2],[X+w/2,h,Z-dep/2],[X-w/2,h,Z-dep/2],[X-w/2,0,Z+dep/2],[X+w/2,0,Z+dep/2],[X+w/2,h,Z+dep/2],[X-w/2,h,Z+dep/2]],p=vs.map(v=>project(...v));if(p.some(v=>!v))return;poly(p[0],p[1],p[2],col);poly(p[0],p[2],p[3],col);poly(p[1],p[5],p[6],col);poly(p[1],p[6],p[2],col);poly(p[4],p[0],p[3],col);poly(p[4],p[3],p[7],col);poly(p[5],p[4],p[7],col);poly(p[5],p[7],p[6],col);
const r=project(X-w*.55,h,Z-dep*.52),q=project(X+w*.55,h,Z-dep*.52),top=project(X,h+1.15,Z-dep*.1);if(r&&q&&top)poly(r,q,top,roof);
const door=project(X,h*.5, Z-dep/2-.04);if(door){x.fillStyle='#49332b';x.fillRect(door[0]-8,door[1]-door[2]*.08,16,door[2]*.16)}
}
function tree(t){let[X,Z,s]=t,tr=project(X,1.3*s,Z),l=project(X,3*s,Z),a=project(X-.8*s,2.2*s,Z),b=project(X+.8*s,2.2*s,Z);if(!tr||!l||!a||!b)return;x.strokeStyle='#65442d';x.lineWidth=Math.max(2,tr[2]*.08);x.beginPath();x.moveTo(tr[0],tr[1]);x.lineTo(l[0],l[1]);x.stroke();x.fillStyle='#397447';for(const q of[a,b,l])x.beginPath(),x.arc(q[0],q[1],Math.max(8,q[2]*.35),0,7),x.fill()}
function pole(t){let[X,Z]=t,a=project(X,0,Z),b=project(X,5.2,Z);if(!a||!b)return;x.strokeStyle='#555';x.lineWidth=Math.max(2,a[2]*.04);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#9fc9df';x.fillRect(0,0,W,H);let horizon=H*.53;
x.fillStyle='#70945d';x.fillRect(0,horizon,W,H-horizon);
const corners=[[-3.5,0,-20],[3.5,0,-20],[3.5,0,205],[-3.5,0,205]].map(v=>project(...v));if(corners.every(Boolean)){x.fillStyle='#505050';x.beginPath();corners.forEach((v,i)=>i?x.lineTo(v[0],v[1]):x.moveTo(v[0],v[1]));x.closePath();x.fill()}
for(let z=-20;z<205;z+=9){let a=project(-.08,.02,z),b=project(.08,.02,z);if(a&&b){x.strokeStyle='#e5d67d';x.lineWidth=3;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}}
[...houses].sort((a,b)=>Math.hypot(b[0]-px,b[1]-pz)-Math.hypot(a[0]-px,a[1]-pz)).forEach(box);trees.forEach(tree);poles.forEach(pole);requestAnimationFrame(draw)}
draw();
function jm(e){let r=joy.getBoundingClientRect(),xx=e.clientX-r.left-r.width/2,yy=e.clientY-r.top-r.height/2,n=Math.hypot(xx,yy),m=42;if(n>m){xx*=m/n;yy*=m/n}jx=xx/m;jy=yy/m;knob.style.transform='translate('+xx+'px,'+yy+'px)'}const joy=document.getElementById('joy'),knob=document.getElementById('knob');joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);jm(e)};joy.onpointermove=jm;joy.onpointerup=joy.onpointercancel=()=>{jx=jy=0;knob.style.transform='translate(0,0)'};look.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)};look.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(-.55,Math.min(.55,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY};look.onpointerup=look.onpointercancel=()=>drag=0;
let last=performance.now();function move(t){let dt=Math.min(.04,(t-last)/1000);last=t;px+=Math.cos(yaw)*jx*4.2*dt;px+=Math.sin(yaw)*jy*4.2*dt;pz+=-Math.sin(yaw)*jx*4.2*dt;pz+=Math.cos(yaw)*jy*4.2*dt;px=Math.max(-3,Math.min(3,px));pz=Math.max(-20,Math.min(205,pz));requestAnimationFrame(move)}move(last);
</script></body></html>
