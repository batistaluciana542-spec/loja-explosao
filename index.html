<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rua 3D - V4</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc9ee;font-family:Arial;touch-action:none}.sky{position:absolute;inset:0;background:linear-gradient(#8fc9ee 0 55%,#6f9658 55%)}.road{position:absolute;left:18%;right:18%;top:55%;bottom:0;background:#555}.road:after{content:"";position:absolute;left:49%;top:0;width:2%;height:100%;background:repeating-linear-gradient(to bottom,#eadb80 0 30px,transparent 30px 60px)}.side{position:absolute;top:55%;bottom:0;width:18%;background:#c9c2b8}.left{left:0}.right{right:0}.house{position:absolute;width:110px;height:95px;bottom:18%;background:#d0b08a;border:2px solid #554;box-shadow:12px 8px 0 #795044}.roof{position:absolute;left:-10px;top:-45px;width:130px;height:55px;background:#70483d;clip-path:polygon(50% 0,100% 100%,0 100%)}.door{position:absolute;width:25px;height:48px;bottom:0;left:43px;background:#4b3930}.win{position:absolute;width:25px;height:22px;top:28px;background:#9bd2df;border:3px solid #eee}.w1{left:10px}.w2{right:10px}.h1{left:3%;transform:scale(.75)}.h2{left:20%;transform:scale(.55)}.h3{right:20%;transform:scale(.55)}.h4{right:3%;transform:scale(.75)}.tree{position:absolute;bottom:16%;width:18px;height:75px;background:#68452d}.tree:after{content:"";position:absolute;width:70px;height:70px;left:-26px;top:-55px;border-radius:50%;background:#3f7c45}.t1{left:12%}.t2{right:12%}.t3{left:27%;bottom:35%;transform:scale(.7)}.t4{right:27%;bottom:35%;transform:scale(.7)}.hud{position:fixed;z-index:20;top:10px;left:10px;color:white;background:#111c;padding:8px 10px;border-radius:8px;font-weight:bold;font-size:12px}.status{position:fixed;z-index:20;top:45px;left:10px;color:white;background:#111c;padding:5px 8px;border-radius:7px;font-size:11px}.joy{position:fixed;z-index:30;left:18px;bottom:18px;width:135px;height:135px;border:2px solid #fff8;border-radius:50%;background:#fff3}.stick{position:absolute;left:40px;top:40px;width:51px;height:51px;border-radius:50%;background:#fff}.look{position:fixed;z-index:25;right:0;top:0;width:68%;height:100%}</style></head><body><div class="sky"></div><div class="road"></div><div class="side left"></div><div class="side right"></div><div class="house h1"><div class="roof"></div><div class="door"></div><div class="win w1"></div><div class="win w2"></div></div><div class="house h2" style="background:#c77d6c"><div class="roof" style="background:#69483c"></div><div class="door"></div><div class="win w1"></div><div class="win w2"></div></div><div class="house h3" style="background:#d5cec2"><div class="roof" style="background:#704d45"></div><div class="door"></div><div class="win w1"></div><div class="win w2"></div></div><div class="house h4" style="background:#e2ddd4"><div class="roof" style="background:#875346"></div><div class="door"></div><div class="win w1"></div><div class="win w2"></div></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="hud">RUA 3D • V4</div><div class="status" id="status">CENA CARREGADA</div><div class="look" id="look"></div><div class="joy" id="joy"><div class="stick" id="stick"></div></div><script>let x=0,y=0,drag=false,lx=0,jx=0,jy=0;const j=document.getElementById('joy'),s=document.getElementById('stick'),l=document.getElementById('look');function move(e){let r=j.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,n=Math.hypot(dx,dy),m=40;if(n>m){dx*=m/n;dy*=m/n}jx=dx/m;jy=dy/m;s.style.transform='translate('+dx+'px,'+dy+'px)'}j.onpointerdown=e=>{j.setPointerCapture(e.pointerId);move(e)};j.onpointermove=e=>move(e);j.onpointerup=j.onpointercancel=()=>{jx=jy=0;s.style.transform='translate(0,0)'};l.onpointerdown=e=>{drag=true;lx=e.clientX};l.onpointermove=e=>{if(drag){x+=(e.clientX-lx)*.3;lx=e.clientX}};l.onpointerup=l.onpointercancel=()=>drag=false;setInterval(()=>{document.querySelector('.status').textContent='CENA CARREGADA • JOYSTICK OK'},500);</script></body></html>
