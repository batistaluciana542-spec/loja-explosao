<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.38);color:#fff;font-size:14px;font-weight:700}
#look{position:absolute;right:0;top:0;width:62%;height:100%;pointer-events:auto}
#joystick{position:absolute;left:20px;bottom:max(22px,env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.42);pointer-events:auto}
#stick{position:absolute;width:58px;height:58px;left:32px;top:32px;border-radius:50%;background:rgba(255,255,255,.72);box-shadow:0 3px 15px rgba(0,0,0,.25)}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.35);color:#fff;font-size:12px;white-space:nowrap}
#map{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:112px;height:112px;border-radius:14px;background:rgba(255,255,255,.86);border:2px solid rgba(0,0,0,.15);overflow:hidden}
#map:before{content:"";position:absolute;left:50%;top:-15%;width:22px;height:140%;background:#aaa;transform:rotate(28deg)}
#map:after{content:"";position:absolute;top:50%;left:-15%;width:140%;height:18px;background:#aaa;transform:rotate(-28deg)}
#dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#1677ff;border:2px solid white;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}
@media(min-width:800px){#joystick{left:28px;bottom:28px}.hint{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="title">RUA 3D • PRIMEIRA PESSOA</div>
  <div id="map"><div id="dot"></div></div>
  <div id="look"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="hint">Arraste a tela para olhar • use o controle para andar</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js';

const root=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x78b8ea);
scene.fog=new THREE.Fog(0x78b8ea,70,180);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,260);
camera.position.set(0,1.68,18);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
root.appendChild(renderer.domElement);

// Materiais sem iluminação artificial: cores diretas, simples e leves para celular.
const mat=(c)=>new THREE.MeshBasicMaterial({color:c});
const road=mat(0x4a4a4a), sidewalk=mat(0xb8a58f), curb=mat(0xd0d0c8);
const wallPink=mat(0xd88d7d), wallWhite=mat(0xe7e1d6), wallGray=mat(0x77736f);
const wallBlue=mat(0x3283d1), wallRed=mat(0xb52c2c), gate=mat(0x777777);
const roof=mat(0x9b5a39), grass=mat(0x3d713b), trunk=mat(0x795438);
const windowMat=mat(0x33383d);

function box(w,h,d,x,y,z,m){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  mesh.position.set(x,y,z); scene.add(mesh); return mesh;
}
function house(x,z,w,h,d,wall,gateColor=gate,gateOffset=0){
  box(w,h,d,x,h/2,z,wall);
  const gx=x+gateOffset, gz=z-d/2-.012;
  box(Math.min(3.3,w*.28),h*.55,.12,gx,h*.28,gz,gateColor);
  // pequenas janelas simples, mantendo a fachada limpa
  if(w>7){
    box(1.55,1.15,.08,x-w*.22,h*.52,gz,windowMat);
    box(1.55,1.15,.08,x+w*.08,h*.52,gz,windowMat);
  }
}
function tree(x,z,s=1){
  box(.42*s,2.6*s,.42*s,x,1.3*s,z,trunk);
  const crown=new THREE.Mesh(new THREE.SphereGeometry(1.55*s,10,8),grass);
  crown.position.set(x,3.1*s,z); scene.add(crown);
}

// Rua principal e cruzamento, inspirado nas imagens enviadas.
box(12,.12,170,0,.02,0,road);
box(34,.12,10,0,.02,-22,road);
box(12,.08,170,-8,.10,0,sidewalk);
box(12,.08,170,8,.10,0,sidewalk);
box(34,.08,2,0,.10,-27,sidewalk);
box(34,.08,2,0,.10,-17,sidewalk);

// Meio-fio.
box(.22,.22,170,-6.02,.16,0,curb);
box(.22,.22,170,6.02,.16,0,curb);
box(34,.22,.22,0,.16,-16.02,curb);
box(34,.22,.22,0,.16,-27.02,curb);

// Fachadas principais, sem veículos ou objetos extras.
house(-9,-4,5.8,3.2,5.5,wallPink,gate,1.0);
house(9,-4,5.8,3.1,5.5,wallWhite,gate,-.7);
house(-9,5,5.8,3.0,5.5,wallGray,wallRed,.9);
house(9,5,5.8,3.0,5.5,wallBlue,gate,-.9);
house(-9,14,5.8,3.0,5.5,wallWhite,wallBlue,.6);
house(9,14,5.8,3.0,5.5,wallBlue,wallGray,-.4);
house(-9,27,5.8,3.0,5.5,wallGray,wallRed,1.0);
house(9,27,5.8,3.0,5.5,wallWhite,gate,-.8);
house(-9,-35,5.8,3.0,5.5,wallWhite,gate,.5);
house(9,-35,5.8,3.0,5.5,wallGray,wallBlue,-.5);

// Telhados baixos sugeridos nas fachadas.
for(const z of [-4,5,14,27,-35]){
  box(6.0,.18,5.7,-9,3.18,z,roof);
  box(6.0,.18,5.7,9,3.08,z,roof);
}

// Árvores que aparecem como referência visual.
tree(-9,9,.95);
tree(9,10,.8);
tree(-9,31,1.05);
tree(9,-30,.95);

// Postes, apenas os elementos que fazem parte da rua fotografada.
function pole(x,z){
  box(.12,6,.12,x,3,z,wallGray);
  box(2.5,.06,.06,x,5.5,z,wallGray);
}
pole(-5.4,-11); pole(5.4,19); pole(-5.4,37);

// Limites simples para o jogador não sair do trecho.
const bounds={x:5.2,zMin:-68,zMax:68};
const keys={};
addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);

// Controles touch.
const joy=document.getElementById('joystick'), stick=document.getElementById('stick');
let joyId=null, joyX=0, joyY=0;
function setJoy(e){
  const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy, max=34;
  const len=Math.hypot(dx,dy);
  if(len>max){dx*=max/len;dy*=max/len}
  stick.style.transform=`translate(${dx}px,${dy}px)`;
  joyX=dx/max; joyY=dy/max;
}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});
function endJoy(e){if(e.pointerId!==joyId)return;joyId=null;joyX=joyY=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);

// Arrastar no lado direito gira a câmera.
const look=document.getElementById('look');
let lookId=null,lastX=0,lastY=0;
let yaw=0,pitch=0;
look.addEventListener('pointerdown',e=>{
  lookId=e.pointerId; look.setPointerCapture(e.pointerId);
  lastX=e.clientX; lastY=e.clientY;
});
look.addEventListener('pointermove',e=>{
  if(e.pointerId!==lookId)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  yaw-=dx*.0042;
  pitch-=dy*.0032;
  pitch=Math.max(-1.25,Math.min(1.25,pitch));
});
function endLook(e){if(e.pointerId===lookId)lookId=null}
look.addEventListener('pointerup',endLook);look.addEventListener('pointercancel',endLook);

// Clique/arrasto no desktop.
renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'&&lookId===e.pointerId){
    yaw-=(e.clientX-lastX)*.0025;
    pitch-=(e.clientY-lastY)*.002;
    pitch=Math.max(-1.25,Math.min(1.25,pitch));
    lastX=e.clientX;lastY=e.clientY;
  }
});
renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')lookId=null});

// Movimento.
const clock=new THREE.Clock();
function update(dt){
  let forward=0,side=0;
  if(keys.KeyW||keys.ArrowUp)forward+=1;
  if(keys.KeyS||keys.ArrowDown)forward-=1;
  if(keys.KeyA||keys.ArrowLeft)side-=1;
  if(keys.KeyD||keys.ArrowRight)side+=1;
  forward+=-joyY; side+=joyX;
  const mag=Math.hypot(forward,side);
  if(mag>1){forward/=mag;side/=mag}
  const speed=5.2*dt;
  const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  camera.position.addScaledVector(dir,forward*speed);
  camera.position.addScaledVector(right,side*speed);
  camera.position.x=Math.max(-5.0,Math.min(5.0,camera.position.x));
  camera.position.z=Math.max(bounds.zMin,Math.min(bounds.zMax,camera.position.z));
  camera.position.y=1.68;
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  update(dt);
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
