<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rua 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc4e8;font-family:Arial;touch-action:none}
#c{width:100%;height:100%;display:block}
#hud{position:fixed;top:10px;left:10px;background:#111b;color:#fff;padding:8px 10px;border-radius:9px;font-weight:bold;font-size:12px;z-index:5}
#joy{position:fixed;left:18px;bottom:18px;width:130px;height:130px;border:2px solid #fff8;border-radius:50%;background:#1114;z-index:10}
#knob{position:absolute;width:50px;height:50px;left:40px;top:40px;border-radius:50%;background:#fff}
</style></head><body>
<canvas id="c"></canvas><div id="hud">RUA 3D • MOTOR LOCAL</div>
<div id="joy"><div id="knob"></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),joy=document.getElementById('joy'),knob=document.getElementById('knob');
let W,H,px=0,pz=0,yaw=0,jx=0,jy=0,look=false,lx=0;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
const houses=[];for(let z=10;z<180;z+=12){houses.push({x:-1,z,w:5+z%3,h:5+(z%4),d:6,col:['#d9b18c','#d7d1c5','#c98273','#d8c39d'][z%4]});houses.push({x:1,z:z+5,w:5+(z%2),h:5,d:6,col:['#ddd5c8','#c99b78','#d9b8a2','#cfcfc8'][z%4]})}
function project(X,Z){let dx=X-px,dz=Z-pz,co=Math.cos(yaw),si=Math.sin(yaw);let a=dx*co-dz*si,b=dx*si+dz*co;if(b<=.5)return null;let s=520/b;return [W/2+a*s,H*.53+(1.7/b)*s,s,b]}
function poly(a,b,d,col){x.fillStyle=col;x.beginPath();x.moveTo(...a);x.lineTo(...b);x.lineTo(...d);x.closePath();x.fill()}
function drawHouse(h){let p=project(h.x,h.z),q=project(h.x,h.z+h.d),r=project(h.x+h.w*(h.x<0?1:-1),h.z),t=project(h.x+h.w*(h.x<0?1:-1),h.z+h.d);if(!p||!q||!r||!t)return;let s=p[2],base=p[1],hh=h.h*s;let A=[p[0],base-hh],B=[r[0],r[1]-hh],C=[t[0],t[1]-hh],D=[q[0],q[1]-hh];x.fillStyle=h.col;x.beginPath();x.moveTo(...A);x.lineTo(...B);x.lineTo(...r);x.lineTo(...p);x.fill();x.fillStyle='#b35e4e';x.beginPath();x.moveTo(...A);x.lineTo((A[0]+B[0])/2,(A[1]-s*.8));x.lineTo(...B);x.fill();x.fillStyle='#6b4738';x.fillRect(p[0]-s*.35,p[1]-hh*.65,s*.7,hh*.65);x.fillStyle='#a8d5df';for(let k=0;k<2;k++)x.fillRect(p[0]+(k?1:-1)*s*.9,p[1]-hh*.68,s*.55,s*.65)}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H*.55);g.addColorStop(0,'#82bce0');g.addColorStop(1,'#cfe5ef');x.fillStyle=g;x.fillRect(0,0,W,H*.58);
x.fillStyle='#6e965d';x.fillRect(0,H*.58,W,H*.42);
let roadTop=H*.55; x.fillStyle='#555';x.beginPath();x.moveTo(W*.42,roadTop);x.lineTo(W*.58,roadTop);x.lineTo(W*.9,H);x.lineTo(W*.1,H);x.fill();
x.fillStyle='#c8c1b7';x.beginPath();x.moveTo(W*.38,roadTop);x.lineTo(W*.42,roadTop);x.lineTo(W*.1,H);x.lineTo(0,H);x.fill();x.beginPath();x.moveTo(W*.58,roadTop);x.lineTo(W*.62,roadTop);x.lineTo(W,H);x.lineTo(W*.9,H);x.fill();
houses.slice().sort((a,b)=>b.z-a.z).forEach(drawHouse);
for(let z=8;z<170;z+=18){for(let side of[-1,1]){let p=project(side*4.8,z);if(p){let s=p[2];x.fillStyle='#63452f';x.fillRect(p[0]-s*.12,p[1]-s*3,s*.24,s*3);x.fillStyle='#397745';x.beginPath();x.arc(p[0],p[1]-s*3.1,s*1.05,0,7);x.fill()}}}
x.strokeStyle='#eee0a0';x.lineWidth=3;for(let z=8;z<160;z+=10){let a=project(0,z),b=project(0,z+4);if(a&&b){x.beginPath();x.moveTo(a[0],a[1]+3);x.lineTo(b[0],b[1]+3);x.stroke()}}
requestAnimationFrame(draw)}
function jm(e){let r=joy.getBoundingClientRect(),X=e.clientX-r.left-r.width/2,Y=e.clientY-r.top-r.height/2,n=Math.hypot(X,Y),m=42;if(n>m){X*=m/n;Y*=m/n}jx=X/m;jy=Y/m;knob.style.transform='translate('+X+'px,'+Y+'px)'}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);jm(e)};joy.onpointermove=jm;joy.onpointerup=joy.onpointercancel=()=>{jx=jy=0;knob.style.transform='translate(0,0)'};
c.onpointerdown=e=>{if(e.clientX>innerWidth*.35){look=true;lx=e.clientX;c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(look){yaw-=(e.clientX-lx)*.008;lx=e.clientX}};c.onpointerup=c.onpointercancel=()=>look=false;
let last=performance.now();function move(t){let dt=Math.min(.04,(t-last)/1000);last=t;px+=jx*4*dt;pz+=-jy*4*dt;requestAnimationFrame(move)}requestAnimationFrame(move);draw();
</script></body></html>
