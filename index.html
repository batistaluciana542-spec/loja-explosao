<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rua 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc5e2;touch-action:none}
body{font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#look{position:fixed;right:0;top:0;width:72%;height:100%;z-index:4;touch-action:none}
#joy{position:fixed;left:18px;bottom:18px;width:138px;height:138px;border:2px solid rgba(255,255,255,.7);border-radius:50%;background:rgba(0,0,0,.18);z-index:10;touch-action:none;box-shadow:0 4px 20px #0005}
#knob{position:absolute;left:43px;top:43px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 3px 12px #0007;pointer-events:none}
#tip{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:8;color:white;background:#0007;padding:7px 12px;border-radius:16px;font-size:12px;pointer-events:none;opacity:.8}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="look"></div>
<div id="joy"><div id="knob"></div></div>
<div id="tip">🕹️ andar • arraste a tela para olhar</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
const joy=document.getElementById('joy');
const knob=document.getElementById('knob');
const look=document.getElementById('look');

let W=innerWidth,H=innerHeight,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

const cam={x:0,y:1.65,z:-5,yaw:0,pitch:0};
let joyX=0,joyY=0,lookOn=false,lastX=0,lastY=0,lastT=performance.now();

const houses=[
 {x:-8.5,z:7,w:5.2,d:6,h:3.1,c:'#d9b08b',r:'#8b5844'},
 {x:-8.6,z:20,w:5.3,d:6.5,h:3.2,c:'#d08b7d',r:'#71453c'},
 {x:-8.5,z:33,w:5.1,d:6.2,h:3.4,c:'#d7d0c5',r:'#66534a'},
 {x:8.5,z:8,w:5.2,d:6,h:3.1,c:'#d7ccb4',r:'#765044'},
 {x:8.6,z:21,w:5.3,d:6.5,h:3.2,c:'#cfa07b',r:'#69473b'},
 {x:8.5,z:34,w:5.1,d:6.2,h:3.4,c:'#ddd6cb',r:'#785247'},
 {x:-8.5,z:46,w:5.2,d:6.2,h:3.1,c:'#c9b39e',r:'#6d5147'},
 {x:8.5,z:47,w:5.2,d:6.2,h:3.1,c:'#d2b18d',r:'#705046'}
];

const trees=[
 [-4.2,6,1], [4.2,12,.9], [-4.1,18,.9], [4.1,28,1],
 [-4.1,39,.85], [4.1,43,.9], [-4.2,52,1], [4.2,57,.85]
];
const poles=[[-3.4,4],[3.4,16],[-3.4,30],[3.4,44],[0,58]];

function camPoint(x,y,z){
  const dx=x-cam.x,dz=z-cam.z;
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
  const rx=dx*cy-dz*sy;
  const rz=dx*sy+dz*cy;
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const ry=(y-cam.y)*cp-rz*sp;
  const rz2=(y-cam.y)*sp+rz*cp;
  if(rz2<=0.08)return null;
  const focal=Math.min(W,H)*0.92;
  return {x:W*.5+rx*focal/rz2,y:H*.52-ry*focal/rz2,z:rz2,s:focal/rz2};
}
function face(points,color){
  if(points.some(p=>!p))return;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);
  ctx.closePath();ctx.fill();
}
function line(a,b,color,width){
  if(!a||!b)return;
  ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}

function house(h){
  const x=h.x,z=h.z,w=h.w,d=h.d,y=h.h;
  const v=[
    camPoint(x-w/2,0,z-d/2),camPoint(x+w/2,0,z-d/2),
    camPoint(x+w/2,y,z-d/2),camPoint(x-w/2,y,z-d/2),
    camPoint(x-w/2,0,z+d/2),camPoint(x+w/2,0,z+d/2),
    camPoint(x+w/2,y,z+d/2),camPoint(x-w/2,y,z+d/2)
  ];
  if(v.some(p=>!p))return;
  face([v[0],v[1],v[2],v[3]],h.c);
  face([v[1],v[5],v[6],v[2]],shade(h.c,-14));
  face([v[4],v[0],v[3],v[7]],shade(h.c,-24));
  face([v[5],v[4],v[7],v[6]],shade(h.c,-30));

  const e1=camPoint(x-w/2,y,z-d/2),e2=camPoint(x+w/2,y,z-d/2);
  const roof=camPoint(x,y+1.05,z-d/2);
  face([e1,e2,roof],h.r);

  // porta e janelas na frente
  const door=camPoint(x,y*.48,z-d/2-.025);
  if(door){
    ctx.fillStyle='#4c342b';
    ctx.fillRect(door.x-door.s*.035,door.y-door.s*.11,door.s*.07,door.s*.22);
  }
  const wy=y*.58;
  for(const wx of [x-w*.27,x+w*.27]){
    const q=camPoint(wx,wy,z-d/2-.03);
    if(q){
      ctx.fillStyle='#9fc4cf';
      ctx.fillRect(q.x-q.s*.045,q.y-q.s*.04,q.s*.09,q.s*.08);
      ctx.strokeStyle='#4b514f';ctx.lineWidth=Math.max(1,q.s*.008);
      ctx.strokeRect(q.x-q.s*.045,q.y-q.s*.04,q.s*.09,q.s*.08);
    }
  }
}

function shade(hex,amount){
  let n=parseInt(hex.slice(1),16);
  let r=Math.max(0,Math.min(255,(n>>16)+amount));
  let g=Math.max(0,Math.min(255,((n>>8)&255)+amount));
  let b=Math.max(0,Math.min(255,(n&255)+amount));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function tree(t){
  const [x,z,s]=t;
  const base=camPoint(x,0,z),top=camPoint(x,3.2*s,z);
  if(!base||!top)return;
  line(base,top,'#5b412d',Math.max(2,base.s*.035));
  for(const q of [[x,z,3.1*s],[x-.65*s,z,2.65*s],[x+.65*s,z,2.65*s]]){
    const p=camPoint(q[0],q[2],q[1]);
    if(!p)continue;
    ctx.fillStyle='#3f7747';
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(7,p.s*.22),0,Math.PI*2);ctx.fill();
  }
}

function pole(p){
  const [x,z]=p;
  const a=camPoint(x,0,z),b=camPoint(x,5.4,z);
  if(!a||!b)return;
  line(a,b,'#555',Math.max(2,a.s*.025));
  const arm=camPoint(x+.9,5.15,z);
  line(b,arm,'#555',Math.max(1,a.s*.018));
}

function ground(){
  // céu
  ctx.fillStyle='#9ccbe3';ctx.fillRect(0,0,W,H);
  const horizon=H*.52;
  ctx.fillStyle='#789b63';ctx.fillRect(0,horizon,W,H-horizon);

  // quadra/terreno dos lados
  const left=[camPoint(-18,0,-20),camPoint(-3.6,0,-20),camPoint(-3.6,0,180),camPoint(-18,0,180)];
  const right=[camPoint(3.6,0,-20),camPoint(18,0,-20),camPoint(18,0,180),camPoint(3.6,0,180)];
  face(left,'#72945d');face(right,'#72945d');

  // rua
  const road=[camPoint(-3.6,.01,-20),camPoint(3.6,.01,-20),camPoint(3.6,.01,180),camPoint(-3.6,.01,180)];
  face(road,'#4c4c4c');

  // calçadas
  const lside=[camPoint(-5.2,.04,-20),camPoint(-3.6,.04,-20),camPoint(-3.6,.04,180),camPoint(-5.2,.04,180)];
  const rside=[camPoint(3.6,.04,-20),camPoint(5.2,.04,-20),camPoint(5.2,.04,180),camPoint(3.6,.04,180)];
  face(lside,'#b7b1a7');face(rside,'#b7b1a7');

  // linha central
  for(let z=Math.floor(cam.z/8)*8;z<180;z+=8){
    const a=camPoint(-.07,.06,z),b=camPoint(.07,.06,z);
    face([a,camPoint(.07,.06,z+3),camPoint(-.07,.06,z+3),b],'#dfd27d');
  }
}

function draw(){
  ground();
  const objects=[];
  houses.forEach(h=>objects.push({d:dist(h.x,h.z),f:()=>house(h)}));
  trees.forEach(t=>objects.push({d:dist(t[0],t[1]),f:()=>tree(t)}));
  poles.forEach(p=>objects.push({d:dist(p[0],p[1]),f:()=>pole(p)}));
  objects.sort((a,b)=>b.d-a.d);
  for(const o of objects)o.f();
  requestAnimationFrame(draw);
}
function dist(x,z){return Math.hypot(x-cam.x,z-cam.z)}
draw();

function setJoy(e){
  const r=joy.getBoundingClientRect();
  let x=e.clientX-r.left-r.width/2;
  let y=e.clientY-r.top-r.height/2;
  const max=43,n=Math.hypot(x,y);
  if(n>max){x=x/n*max;y=y/n*max}
  joyX=x/max;joyY=y/max;
  knob.style.transform='translate('+x+'px,'+y+'px)';
}
joy.addEventListener('pointerdown',e=>{
  e.preventDefault();joy.setPointerCapture(e.pointerId);setJoy(e);
});
joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))setJoy(e)});
function releaseJoy(){
  joyX=0;joyY=0;knob.style.transform='translate(0,0)';
}
joy.addEventListener('pointerup',releaseJoy);
joy.addEventListener('pointercancel',releaseJoy);

look.addEventListener('pointerdown',e=>{
  e.preventDefault();lookOn=true;lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(e.pointerId);
});
look.addEventListener('pointermove',e=>{
  if(!lookOn)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  cam.yaw-=dx*.006;
  cam.pitch=Math.max(-.32,Math.min(.32,cam.pitch-dy*.004));
  lastX=e.clientX;lastY=e.clientY;
});
function endLook(){lookOn=false}
look.addEventListener('pointerup',endLook);
look.addEventListener('pointercancel',endLook);

function update(t){
  const dt=Math.min(.035,(t-lastT)/1000);lastT=t;
  const speed=4.4;
  const forward=-joyY*speed*dt;
  const strafe=joyX*speed*dt;
  cam.x += Math.sin(cam.yaw)*forward + Math.cos(cam.yaw)*strafe;
  cam.z += Math.cos(cam.yaw)*forward - Math.sin(cam.yaw)*strafe;
  cam.x=Math.max(-3,Math.min(3,cam.x));
  cam.z=Math.max(-12,Math.min(105,cam.z));
  requestAnimationFrame(update);
}
requestAnimationFrame(update);

// mouse no computador
let keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function keyboard(t){
  const dt=Math.min(.035,(t-lastT)/1000);
  if(keys.w||keys.arrowup){cam.x+=Math.sin(cam.yaw)*4*dt;cam.z+=Math.cos(cam.yaw)*4*dt}
  if(keys.s||keys.arrowdown){cam.x-=Math.sin(cam.yaw)*4*dt;cam.z-=Math.cos(cam.yaw)*4*dt}
  if(keys.a||keys.arrowleft){cam.x-=Math.cos(cam.yaw)*4*dt;cam.z+=Math.sin(cam.yaw)*4*dt}
  if(keys.d||keys.arrowright){cam.x+=Math.cos(cam.yaw)*4*dt;cam.z-=Math.sin(cam.yaw)*4*dt}
  cam.x=Math.max(-3,Math.min(3,cam.x));cam.z=Math.max(-12,Math.min(105,cam.z));
  requestAnimationFrame(keyboard);
}
requestAnimationFrame(keyboard);
</script>
</body>
</html>
