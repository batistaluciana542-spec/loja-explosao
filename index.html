<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rua 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87c9ee;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000;z-index:5}
#title{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#111b;padding:8px 14px;border-radius:10px;font-weight:800}
#hint{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:#1119;padding:6px 10px;border-radius:8px;font-size:12px}
#joy{pointer-events:auto;position:absolute;left:18px;bottom:20px;width:120px;height:120px;border-radius:50%;background:#1118;border:2px solid #fff8}
#stick{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#fff}
#look{pointer-events:auto;position:absolute;right:0;top:0;width:58%;height:100%}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="title">RUA 3D</div>
 <div id="hint">Arraste à direita para olhar • joystick para andar</div>
 <div id="joy"><div id="stick"></div></div>
 <div id="look"></div>
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

let px=0,pz=8,yaw=0,joyX=0,joyY=0,drag=false,lastX=0;
const houses=[
 {x:-8,z:2,w:5,h:3.2,d:4,c:'#e7d0ad',r:'#8b513c'},
 {x:-9,z:-5,w:5.5,h:3.7,d:4.5,c:'#d8d8d0',r:'#6b5547'},
 {x:-8,z:-12,w:4.5,h:3,d:4,c:'#e6c7bb',r:'#7c4b3d'},
 {x:8,z:2,w:5,h:3.2,d:4,c:'#d9c7df',r:'#75525b'},
 {x:9,z:-5,w:5.5,h:3.7,d:4.5,c:'#dfd2b5',r:'#6d5040'},
 {x:8,z:-12,w:4.5,h:3,d:4,c:'#cbd7c7',r:'#596b55'}
];
const trees=[[-5,0],[-6,-8],[5,-2],[6,-10],[-10,-17],[10,-18]];
const posts=[[-5,5],[5,5],[-5,-10],[5,-10]];

function project(x,y,z){
 const dx=x-px,dz=z-pz;
 const co=Math.cos(yaw),si=Math.sin(yaw);
 const X=dx*co-dz*si;
 const Z=dx*si+dz*co;
 if(Z<=0.2)return null;
 const f=Math.min(W,H)*0.92;
 return {x:W/2+X*f/Z,y:H/2-y*f/Z,scale:f/Z,z:Z};
}
function poly(points,fill,stroke){
 ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
 ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}
function box(o){
 const base=project(o.x,0,o.z),top=project(o.x,o.h,o.z);
 if(!base||!top)return;
 const s=top.scale;
 const hw=o.w*s/2,hd=o.d*s/2;
 const p1=project(o.x-o.w/2,0,o.z),p2=project(o.x+o.w/2,0,o.z);
 const t1=project(o.x-o.w/2,o.h,o.z),t2=project(o.x+o.w/2,o.h,o.z);
 if(!p1||!p2||!t1||!t2)return;
 poly([t1,t2,p2,p1],o.c,'#55483f');
 const doorW=Math.max(4,o.w*s*.16),doorH=Math.max(8,o.h*s*.48);
 poly([
  {x:(t1.x+t2.x)/2-doorW/2,y:p1.y},
  {x:(t1.x+t2.x)/2+doorW/2,y:p1.y},
  {x:(t1.x+t2.x)/2+doorW/2,y:p1.y-doorH},
  {x:(t1.x+t2.x)/2-doorW/2,y:p1.y-doorH}
 ],'#5a4336');
 const winW=Math.max(5,o.w*s*.19),winH=Math.max(5,o.h*s*.22);
 for(const side of [-1,1]){
   const cx=(t1.x+t2.x)/2+side*o.w*s*.27;
   poly([{x:cx-winW/2,y:p1.y-o.h*s*.52},{x:cx+winW/2,y:p1.y-o.h*s*.52},{x:cx+winW/2,y:p1.y-o.h*s*.30},{x:cx-winW/2,y:p1.y-o.h*s*.30}], '#79aabd','#eee');
 }
 // roof
 const roofTop=project(o.x,o.h+.8,o.z);
 if(roofTop){
   poly([{x:t1.x,y:t1.y},{x:roofTop.x,y:roofTop.y},{x:t2.x,y:t2.y}],o.r,'#4c372e');
 }
}
function tree(x,z){
 const b=project(x,0,z),t=project(x,2.7,z);
 if(!b||!t)return;
 const s=t.scale;
 ctx.fillStyle='#70513d';ctx.fillRect(b.x-3*s,b.y-2.7*s,6*s,2.7*s);
 ctx.fillStyle='#3f7540';ctx.beginPath();ctx.arc(t.x,t.y,1.15*s,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#4e8748';ctx.beginPath();ctx.arc(t.x-.65*s,t.y+.25*s,.8*s,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.arc(t.x+.65*s,t.y+.25*s,.8*s,0,Math.PI*2);ctx.fill();
}
function post(x,z){
 const b=project(x,0,z),t=project(x,5,z);
 if(!b||!t)return;
 ctx.strokeStyle='#555';ctx.lineWidth=Math.max(2,t.scale*.08);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(t.x,t.y);ctx.stroke();
 const a=project(x-1.8,4.5,z),q=project(x+1.8,4.5,z);
 if(a&&q){ctx.lineWidth=Math.max(1,t.scale*.025);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H*.62);sky.addColorStop(0,'#72bce8');sky.addColorStop(1,'#d5edfa');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#6d6d6d';ctx.fillRect(0,H*.52,W,H*.48);
 // road perspective
 const van={x:W/2,y:H*.52};
 poly([{x:W*.38,y:H},{x:W*.62,y:H},{x:W*.54,y:H*.52},{x:W*.46,y:H*.52}],'#4f4f4f');
 // sidewalks
 poly([{x:0,y:H},{x:W*.38,y:H},{x:W*.46,y:H*.52},{x:0,y:H*.52}],'#c5c0b7');
 poly([{x:W*.62,y:H},{x:W,y:H},{x:W,y:H*.52},{x:W*.54,y:H*.52}],'#c5c0b7');
 // center line
 ctx.strokeStyle='#ddd';ctx.lineWidth=3;ctx.setLineDash([25,30]);ctx.beginPath();ctx.moveTo(W/2,H);ctx.lineTo(W/2,H*.52);ctx.stroke();ctx.setLineDash([]);
 const objs=[];
 houses.forEach((h,i)=>objs.push({z:(h.z-pz),type:'h',h,i}));
 trees.forEach((t,i)=>objs.push({z:t[1]-pz,type:'t',i}));
 posts.forEach((p,i)=>objs.push({z:p[1]-pz,type:'p',i}));
 objs.sort((a,b)=>a.z-b.z);
 for(const o of objs){
   if(o.type==='h')box(houses[o.i]);
   else if(o.type==='t')tree(trees[o.i][0],trees[o.i][1]);
   else post(posts[o.i][0],posts[o.i][1]);
 }
}
function loop(){draw();requestAnimationFrame(loop)}loop();

function move(){
 const speed=.09;
 const fx=Math.sin(yaw),fz=Math.cos(yaw);
 px += (-joyY*speed)*fx + (joyX*speed)*fz;
 pz += (-joyY*speed)*fz - (joyX*speed)*fx;
}
setInterval(move,16);

const look=document.getElementById('look'),joy=document.getElementById('joy'),stick=document.getElementById('stick');
look.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;look.setPointerCapture(e.pointerId)});
look.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.006;lastX=e.clientX});
look.addEventListener('pointerup',()=>drag=false);look.addEventListener('pointercancel',()=>drag=false);
let active=false,cx=0,cy=0;
joy.addEventListener('pointerdown',e=>{active=true;cx=e.clientX;cy=e.clientY;joy.setPointerCapture(e.pointerId)});
joy.addEventListener('pointermove',e=>{if(!active)return;joyX=Math.max(-1,Math.min(1,(e.clientX-cx)/38));joyY=Math.max(-1,Math.min(1,(e.clientY-cy)/38));stick.style.transform='translate('+joyX*38+'px,'+joyY*38+'px)'});
function reset(){active=false;joyX=joyY=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);
})();
</script>
</body>
</html>
